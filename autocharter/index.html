function mixHexColors(a,b,t){
  a=String(a||'#000000');b=String(b||'#ffffff');
  var ah=a.replace('#',''),bh=b.replace('#','');
  if(ah.length===3)ah=ah.split('').map(function(ch){return ch+ch;}).join('');
  if(bh.length===3)bh=bh.split('').map(function(ch){return ch+ch;}).join('');
  var an=parseInt(ah,16),bn=parseInt(bh,16);
  if(!isFinite(an)||!isFinite(bn))return b;
  var clamp=Math.max(0,Math.min(1,t||0));
  var out=[16,8,0].map(function(shift){
    var av=(an>>shift)&255,bv=(bn>>shift)&255;
    return Math.round(av+(bv-av)*clamp).toString(16).padStart(2,'0');
  }).join('');
  return '#'+out;
}

function normalizeGeoName(name){
  var text=String(name||'');
  if(text.normalize)text=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  text=text.toUpperCase().replace(/&/g,' AND ');
  text=text.replace(/\bKEP\.\s*/g,'KEP ');
  text=text.replace(/[^A-Z0-9]+/g,'');
  return text;
}

function canonicalGeoName(name){
  var key=normalizeGeoName(name);
  return GEO_NAME_ALIASES[key]||key;
}

function getGeoFeatureName(feature){
  var props=feature&&feature.properties||{};
  return props.shapeName||props.name||props.NAME||props.admin||props.ADMIN||props.geounit||props.GEOUNIT||props.sovereignt||props.SOVEREIGNT||props.formal_en||props.NAME_ENG||props.name_en||props.shapeISO||feature&&feature.id||'';
}

function getGeoFeatureKeys(feature){
  var props=feature&&feature.properties||{};
  return typeListUnique([
    canonicalGeoName(getGeoFeatureName(feature)),
    canonicalGeoName(props.shapeName),
    canonicalGeoName(props.name),
    canonicalGeoName(props.NAME),
    canonicalGeoName(props.admin),
    canonicalGeoName(props.ADMIN),
    canonicalGeoName(props.geounit),
    canonicalGeoName(props.GEOUNIT),
    canonicalGeoName(props.sovereignt),
    canonicalGeoName(props.SOVEREIGNT),
    canonicalGeoName(props.formal_en),
    canonicalGeoName(props.NAME_ENG),
    canonicalGeoName(props.name_en),
    canonicalGeoName(props.shapeISO),
    canonicalGeoName(feature&&feature.id)
  ].filter(Boolean));
}

function forEachGeometryPoint(coords,cb){
  if(!Array.isArray(coords))return;
  if(typeof coords[0]==='number'){
    cb(coords[0],coords[1]);
    return;
  }
  coords.forEach(function(part){forEachGeometryPoint(part,cb);});
}

function featureBoundsCenter(feature){
  var geom=feature&&feature.geometry;
  if(!geom)return {longitude:0,latitude:0};
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  forEachGeometryPoint(geom.coordinates,function(x,y){
    if(x<minX)minX=x;
    if(x>maxX)maxX=x;
    if(y<minY)minY=y;
    if(y>maxY)maxY=y;
  });
  if(!isFinite(minX)||!isFinite(minY)||!isFinite(maxX)||!isFinite(maxY))return {longitude:0,latitude:0};
  return {longitude:(minX+maxX)/2,latitude:(minY+maxY)/2};
}

function fetchJsonCached(key,url){
  if(geoPromiseCache[key])return geoPromiseCache[key];
  geoPromiseCache[key]=fetch(url).then(function(resp){
    if(!resp.ok)throw new Error('HTTP '+resp.status+' for '+url);
    return resp.json();
  });
  return geoPromiseCache[key];
}

function loadIndonesiaAdm1Shapes(){

      return {

function loadWorldCountryShapes(){

      ?topo.features

        ?window.ChartGeo.topojson.feature(topo,topo.objects.countries).features

function indexGeoFeatures(features){
  var index={};
  (features||[]).forEach(function(feature){
    getGeoFeatureKeys(feature).forEach(function(key){
      if(key&&!index[key])index[key]=feature;
    });
  });
  return index;
}

function buildGeoMatch(dataset,f){
  var values=f.data||[],labels=f.labels||[];
  var matches=[],valueByKey={},labelByKey={};
  labels.forEach(function(label,i){
    var key=canonicalGeoName(label);
    var feature=dataset.featureIndex[key];
    var value=values[i];
    if(feature&&isFiniteNumberValue(value)){
      valueByKey[key]=value;
      labelByKey[key]=String(label);
      matches.push({key:key,label:String(label),value:value,feature:feature});
    }
  });
  var points=matches.map(function(match){
    var center=featureBoundsCenter(match.feature);
    return {
      label:match.label,
      value:match.value,
      longitude:center.longitude,
      latitude:center.latitude
    };
  });
  var choroplethData=(dataset.features||[]).map(function(feature){
    var keys=getGeoFeatureKeys(feature);
    var chosenKey=keys.find(function(key){return valueByKey.hasOwnProperty(key);});
    return {
      feature:feature,
      value:chosenKey!=null?valueByKey[chosenKey]:null,
      matched:chosenKey!=null,
      label:chosenKey!=null?labelByKey[chosenKey]:getGeoFeatureName(feature)
    };
  });
  return {
    dataset:dataset,
    matches:matches,
    points:points,
    choroplethData:choroplethData,
    count:matches.length,
    coverage:labels.length?matches.length/labels.length:0
  };
}

function chooseBestGeoMatch(f){
  if(!window.ChartGeo)return Promise.resolve(null);
  return Promise.allSettled([loadIndonesiaAdm1Shapes(),loadWorldCountryShapes()]).then(function(results){
    var candidates=results.filter(function(r){return r.status==='fulfilled';}).map(function(r){return buildGeoMatch(r.value,f);}).filter(function(match){return match.count>0;});
    if(!candidates.length)return null;
    candidates.sort(function(a,b){
      if(b.count!==a.count)return b.count-a.count;
      return b.coverage-a.coverage;
    });
    var best=candidates[0];
    return best.count>=Math.max(2,Math.min((f.labels||[]).length,3))||best.coverage>=0.5?best:null;
  });
}

function renderMapFallback(canvas,f,cs,lbl,mode,note){
  renderCustomCanvas(canvas,f,cs,lbl,function(ctx,w,h){
    var rows=canvasRowsFromCategory(f,cs).sort(function(a,b){return b.value-a.value;});
    if(!rows.length){
      drawCanvasNote(ctx,note||'No geographic data could be matched',w,h);
      return;
    }
    var max=Math.max.apply(null,rows.map(function(r){return r.value;})),min=Math.min.apply(null,rows.map(function(r){return r.value;}));
    if(mode==='symbol'||mode==='locator'){
      var cx=w/2,cy=h/2,rx=w*0.34,ry=h*0.32;
      var bubbleScale=parseFloat(getChartFormat(currentIdx).chart.bubbleScale)||1;
      ctx.fillStyle='#f7f8fa';ctx.beginPath();ctx.ellipse(cx,cy,rx+42,ry+30,0,0,Math.PI*2);ctx.fill();
      rows.forEach(function(r,i){
        var angle=-Math.PI/2+i/Math.max(1,rows.length)*Math.PI*2;
        var x=cx+Math.cos(angle)*rx*(0.35+0.65*((i%3)+1)/3);
        var y=cy+Math.sin(angle)*ry*(0.35+0.65*((i%4)+1)/4);
        var rad=(6+(max===min?0:(r.value-min)/(max-min))*16)*bubbleScale;
        ctx.fillStyle=withAlpha(getColor(cs,['bar','accent'],'#8B2635'),0.74);ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
        if(lbl.show)drawCanvasLabel(ctx,r.label,x,y-rad-8,100,10,'#1B2A4A','center');
      });
      drawCanvasNote(ctx,note||'Real map geometry could not be resolved for these labels',w,h);
      return;
    }
    var cols=Math.ceil(Math.sqrt(rows.length||1)),tileW=(w-28)/cols,tileH=Math.max(40,(h-36)/Math.ceil((rows.length||1)/cols));
    rows.forEach(function(r,i){
      var intensity=max===min?0.65:(r.value-min)/(max-min)*0.75+0.2;
      var x=14+(i%cols)*tileW,y=14+Math.floor(i/cols)*tileH;
      ctx.fillStyle=withAlpha(getColor(cs,['slice_'+i,'bar'],'#8B2635'),intensity);
      ctx.fillRect(x,y,tileW-6,tileH-6);
      drawCanvasLabel(ctx,r.label,x+8,y+15,tileW-20,10,'#fff','left');
      if(lbl.show)drawCanvasLabel(ctx,formatChartValue(f,r.value,getChartFormat(currentIdx).labels),x+8,y+32,tileW-20,10,'#fff','left');
    });
    drawCanvasNote(ctx,note||'Real map geometry could not be resolved for these labels',w,h);
  });
}

function buildMapInterpolator(cs){
  var low=getColor(cs,['low','bar'],'#dbeafe');
  var high=getColor(cs,['high','bar'],'#8B2635');
  return function(v){
    return mixHexColors(low,high,v);
  };
}

function renderCustomCanvas(canvas,f,cs,lbl,drawFn){
  var context=canvas.getContext&&canvas.getContext('2d');
  if(!context)return;
  var wrap=document.getElementById('chartWrap');
  function draw(){
    var w=Math.max(240,(wrap&&wrap.clientWidth)||wrap&&wrap.offsetWidth||canvas.clientWidth||720);
    var h=Math.max(200,(wrap&&wrap.clientHeight)||wrap&&wrap.offsetHeight||canvas.clientHeight||420);
    var dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px';
    canvas.style.height=h+'px';
    context.setTransform(dpr,0,0,dpr,0,0);
    context.clearRect(0,0,w,h);
    drawFn(context,w,h);
  }
  draw();
  chart={
    destroy:function(){},
    resize:draw,
    toBase64Image:function(type,quality){return canvas.toDataURL(type||'image/png',quality||1);}
  };
}

function drawCanvasLabel(ctx,text,x,y,maxWidth,size,color,align){
  ctx.save();
  ctx.fillStyle=color||'#1B2A4A';
  ctx.font='600 '+(size||11)+'px Segoe UI, Arial, sans-serif';
  ctx.textAlign=align||'left';
  ctx.textBaseline='middle';
  var s=String(text||'');
  if(maxWidth&&ctx.measureText(s).width>maxWidth){
    while(s.length>4&&ctx.measureText(s+'...').width>maxWidth)s=s.slice(0,-1);
    s=s+'...';
  }
  ctx.fillText(s,x,y);
  ctx.restore();
}

function renderTreemap(canvas,f,cs,lbl){
  renderCustomCanvas(canvas,f,cs,lbl,function(ctx,w,h){
    var rows=canvasRowsFromPartWhole(f,cs).sort(function(a,b){return b.value-a.value;});
    var total=rows.reduce(function(a,r){return a+r.value;},0);
    var pad=14,area={x:pad,y:pad,w:w-pad*2,h:h-pad*2};
    function layout(items,rect,depth){
      if(!items.length||rect.w<=0||rect.h<=0)return;
      if(items.length===1){
        drawTile(items[0],rect,total);
        return;
      }
      var sum=items.reduce(function(a,r){return a+r.value;},0),half=sum/2,acc=0,split=0;
      for(var i=0;i<items.length;i++){acc+=items[i].value;if(acc>=half){split=i+1;break;}}
      split=Math.max(1,Math.min(items.length-1,split));
      var left=items.slice(0,split),right=items.slice(split);
      var leftSum=left.reduce(function(a,r){return a+r.value;},0);
      if(rect.w>=rect.h){
        var lw=rect.w*(leftSum/sum);
        layout(left,{x:rect.x,y:rect.y,w:lw,h:rect.h},depth+1);
        layout(right,{x:rect.x+lw,y:rect.y,w:rect.w-lw,h:rect.h},depth+1);
      } else {
        var lh=rect.h*(leftSum/sum);
        layout(left,{x:rect.x,y:rect.y,w:rect.w,h:lh},depth+1);
        layout(right,{x:rect.x,y:rect.y+lh,w:rect.w,h:rect.h-lh},depth+1);
      }
    }
    function drawTile(r,rect,total){
      ctx.fillStyle=withAlpha(r.color,0.88);
      ctx.fillRect(rect.x+1,rect.y+1,Math.max(0,rect.w-2),Math.max(0,rect.h-2));
      if(rect.w>58&&rect.h>32){
        drawCanvasLabel(ctx,r.label,rect.x+8,rect.y+15,rect.w-16,11,'#ffffff','left');
        drawCanvasLabel(ctx,formatChartValue(f,r.value,getChartFormat(currentIdx).labels),rect.x+8,rect.y+32,rect.w-16,11,'#ffffff','left');
      }
    }
    layout(rows,area,0);
    if(!rows.length)drawCanvasNote(ctx,'No positive part-to-whole data available',w,h);
  });
}

function renderSunburst(canvas,f,cs,lbl){
  renderCustomCanvas(canvas,f,cs,lbl,function(ctx,w,h){
    var rows=canvasRowsFromPartWhole(f,cs),total=rows.reduce(function(a,r){return a+r.value;},0);
    var cx=w/2,cy=h/2,r=Math.min(w,h)*0.38,inner=r*0.42,start=-Math.PI/2;
    rows.forEach(function(row,i){
      var a=total?row.value/total*Math.PI*2:0,end=start+a;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();
      ctx.fillStyle=row.color;ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      if(lbl.show&&a>0.22){
        var mid=(start+end)/2;
        drawCanvasLabel(ctx,row.label,cx+Math.cos(mid)*r*0.7,cy+Math.sin(mid)*r*0.7,88,10,'#fff','center');
      }
      start=end;
    });
    ctx.beginPath();ctx.arc(cx,cy,inner,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    drawCanvasLabel(ctx,'Total',cx,cy-8,100,11,'#6b7280','center');
    drawCanvasLabel(ctx,formatChartValue(f,total,getChartFormat(currentIdx).labels),cx,cy+10,120,13,'#1B2A4A','center');
  });
}

function renderFunnel(canvas,f,cs,lbl){
  renderCustomCanvas(canvas,f,cs,lbl,function(ctx,w,h){
    var rows=canvasRowsFromCategory(f,cs).filter(function(r){return r.value>0;});
    var max=Math.max.apply(null,rows.map(function(r){return r.value;}));
    var neck=(parseFloat(getChartFormat(currentIdx).chart.funnelNeck)||45)/100;
    var top=18,step=(h-44)/Math.max(1,rows.length),cx=w/2,maxW=w*0.72;
    rows.forEach(function(r,i){
      var curr=max?maxW*(r.value/max):0;
      var next=rows[i+1]&&max?maxW*(rows[i+1].value/max):curr*neck;
      var y=top+i*step,hh=Math.max(20,step-5);
      ctx.beginPath();
      ctx.moveTo(cx-curr/2,y);ctx.lineTo(cx+curr/2,y);ctx.lineTo(cx+next/2,y+hh);ctx.lineTo(cx-next/2,y+hh);ctx.closePath();
      ctx.fillStyle=getColor(cs,['slice_'+i,'bar'],paletteColor(i));ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      drawCanvasLabel(ctx,r.label+'  '+formatChartValue(f,r.value,getChartFormat(currentIdx).labels),cx,y+hh/2,curr-18,11,'#fff','center');
    });
  });
}

function renderBulletBar(canvas,f,cs,lbl){

    var rows=ranges.length?ranges.map(function(r){return {label:r.label,value:r.end,target:r.start};}):canvasRowsFromCategory(f,cs).map(function(r){return {label:r.label,value:r.value,target:(f.xMax||f.yMax||autoAxisMax([r.value])||r.value)*0.8};});
    var max=Math.max.apply(null,rows.reduce(function(a,r){return a.concat([r.value,r.target]);},[1]));
    var left=150,right=34,top=18,rowH=Math.max(28,(h-36)/Math.max(1,rows.length));
    rows.forEach(function(r,i){
      var y=top+i*rowH+rowH/2,trackW=w-left-right;
      drawCanvasLabel(ctx,r.label,14,y,126,11,'#1B2A4A','left');
      ctx.fillStyle=getColor(cs,['band'],'#E5E7EB');ctx.fillRect(left,y-8,trackW,16);
      ctx.fillStyle=getColor(cs,['bar'],'#8B2635');ctx.fillRect(left,y-6,trackW*(r.value/max),12);
      var tx=left+trackW*(r.target/max);
      ctx.strokeStyle=getColor(cs,['target'],'#1B2A4A');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx,y-12);ctx.lineTo(tx,y+12);ctx.stroke();
      if(lbl.show)drawCanvasLabel(ctx,formatChartValue(f,r.value,getChartFormat(currentIdx).labels),left+trackW*(r.value/max)+6,y,72,10,'#1B2A4A','left');
    });

function renderTableChart(canvas,f,cs,lbl){
  renderCustomCanvas(canvas,f,cs,lbl,function(ctx,w,h){
    var table=chartToEditableTable(f),headers=table.headers||[],rows=(table.rows||[]).slice(0,Math.max(1,Math.floor((h-34)/26)));
    var tf=getChartFormat(currentIdx).table;
    var fontSize=Math.max(8,Math.min(24,parseFloat(tf.fontSize)||11));
    var pad=10,rowH=Math.max(22,fontSize+14),colW=(w-pad*2)/Math.max(1,headers.length);
    ctx.fillStyle=tf.headerBg;ctx.fillRect(pad,pad,w-pad*2,rowH);
    headers.forEach(function(head,i){drawCanvasLabel(ctx,head,pad+i*colW+8,pad+rowH/2,colW-12,fontSize,tf.headerText,'left');});
    rows.forEach(function(row,r){
      var y=pad+rowH*(r+1);
      ctx.fillStyle=r%2?tf.rowBg:tf.stripeBg;ctx.fillRect(pad,y,w-pad*2,rowH);
      ctx.strokeStyle=tf.border;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();
      headers.forEach(function(head,c){drawCanvasLabel(ctx,row[c],pad+c*colW+8,y+rowH/2,colW-12,fontSize,tf.bodyText,'left');});
    });
    ctx.strokeStyle=tf.border;
    for(var c=0;c<=headers.length;c++){
      var x=pad+c*colW;
      ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,pad+rowH*(rows.length+1));ctx.stroke();
    }
    ctx.strokeRect(pad,pad,w-pad*2,rowH*(rows.length+1));
  });
}

function renderMapChart(canvas,f,cs,lbl,mode){
  var requestId=String(++geoMapRenderNonce);
  canvas.dataset.geoRenderRequest=requestId;
  if(!window.ChartGeo){
    renderMapFallback(canvas,f,cs,lbl,mode,'Map library is unavailable; using fallback preview');
    return;
  }
  renderMapStatus(canvas,'Loading map geometry...');
  chooseBestGeoMatch(f).then(function(match){
    if(canvas.dataset.geoRenderRequest!==requestId)return;
    if(!match){
      renderMapFallback(canvas,f,cs,lbl,mode,'No supported boundaries matched these labels');
      return;
    }
    if(chart&&chart.destroy)chart.destroy();
    chart=createGeoChart(canvas,f,cs,lbl,mode,match);
  }).catch(function(err){
    console.error('map render failed',err);
    if(canvas.dataset.geoRenderRequest!==requestId)return;
    renderMapFallback(canvas,f,cs,lbl,mode,'Map data could not be loaded; using fallback preview');
  });
}

function renderSurface(canvas,f,cs,lbl){
  renderCustomCanvas(canvas,f,cs,lbl,function(ctx,w,h){
    var points=getBubbleSeries(f);
    if(!points.length&&Array.isArray(f.points))points=f.points.map(function(p){return {x:p.x,y:p.y,size:p.y,label:p.label};});
    var values=points.map(function(p){return p.size||p.r||p.y||0});
    var min=Math.min.apply(null,values),max=Math.max.apply(null,values);
    var left=42,top=20,plotW=w-66,plotH=h-54,cols=8,rows=6,cellW=plotW/cols,cellH=plotH/rows;
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
      var p=points[(r*cols+c)%Math.max(1,points.length)]||{size:0};
      var t=max===min?0.5:((p.size||p.r||p.y||0)-min)/(max-min);
      ctx.fillStyle=withAlpha(getColor(cs,['bar'],'#8B2635'),0.18+t*0.72);
      ctx.fillRect(left+c*cellW,top+r*cellH,cellW-1,cellH-1);
    }
    ctx.strokeStyle='#d1d5db';ctx.strokeRect(left,top,plotW,plotH);
    drawCanvasLabel(ctx,'Surface / contour preview',left,top+plotH+22,180,11,'#6b7280','left');
  });
}

function renderMultiBarColumn(ctx,f,cs,lbl,opts){
  var series=getMultiSeries(f);
  var labels=series.labels;
  var sums=labels.map(function(label,i){
    return series.datasets.reduce(function(total,d){
      var v=d.data[i];
      return total+(typeof v==='number'&&isFinite(v)?v:0);
    },0);
  });
  var datasets=series.datasets.map(function(d,i){
    var color=getColor(cs,[d.label],paletteColor(i));
    var values=d.data.map(function(v,idx){
      if(typeof v!=='number'||!isFinite(v))return null;
      return opts.percent?(sums[idx]?v/sums[idx]*100:0):v;
    });
    return {
      label:d.label,
      data:values,
      backgroundColor:color,
      borderColor:color,
      borderWidth:0,
      barPercentage:0.72,
      categoryPercentage:0.82,
      datalabels:buildDatalabelOptions(f,lbl,{
        display:function(c){
          var v=c.dataset.data[c.dataIndex];
          if(!lbl.show||typeof v!=='number'||!isFinite(v))return false;
          return !opts.percent||v>=3.5;
        },
        anchor:opts.stacked?'center':'end',
        align:opts.stacked?'center':(opts.horizontal?'right':'top'),
        outsideAlign:opts.horizontal?'right':'top',
        offset:4,
        font:{size:10,weight:'600'},
        forceColor:opts.stacked&&lbl.style!=='boxed'?'#ffffff':undefined,
        fontSize:10,
        percentValue:opts.percent
      })
    };
  });
  var valueAxis=opts.horizontal?'x':'y';
  var categoryAxis=opts.horizontal?'y':'x';
  var valueScale=opts.percent
    ?makePercentScale(f,valueAxis,{stacked:opts.stacked,beginAtZero:true,max:100,borderDisplay:false})
    :makeNumericScale(f,valueAxis,{stacked:opts.stacked,beginAtZero:true,borderDisplay:false});
  var categoryScale=makeCategoryScale(f,categoryAxis,{stacked:opts.stacked,gridDisplay:false,borderDisplay:true});
  chart=new Chart(ctx,{
    type:'bar',
    data:{labels:labels,datasets:datasets},
    options:{
      indexAxis:opts.horizontal?'y':'x',
      responsive:true,
      maintainAspectRatio:false,
      layout:{padding:{right:opts.horizontal?64:14,top:18,left:4}},
      scales:opts.horizontal?{x:valueScale,y:categoryScale}:{x:categoryScale,y:valueScale},
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'#1B2A4A',cornerRadius:6,padding:10,callbacks:{label:function(c){
          var v=opts.horizontal?c.parsed.x:c.parsed.y;
          return c.dataset.label+': '+(opts.percent?formatPercentValue(v,1):formatChartValue(f,v,getAxisFormat(f,valueAxis)));
        }}}
      },
      animation:{duration:300}
    }
  });
}

function buildHistogramBins(values,countOverride){
  if(!values.length)return {labels:[],data:[]};
  var min=Math.min.apply(null,values),max=Math.max.apply(null,values);
  if(min===max)return {labels:[String(min)],data:[values.length]};
  var requested=parseInt(countOverride,10);
  var count=isFinite(requested)?Math.max(2,Math.min(30,requested)):Math.max(4,Math.min(10,Math.ceil(Math.sqrt(values.length))));
  var width=(max-min)/count;
  var bins=new Array(count).fill(0);
  values.forEach(function(v){
    var idx=Math.min(count-1,Math.floor((v-min)/width));
    bins[idx]++;
  });
  return {
    labels:bins.map(function(v,i){return defaultNumberFormat(min+i*width)+'-'+defaultNumberFormat(min+(i+1)*width);}),
    data:bins
  };
}

function downloadCSV(){
  var f=FIGS[currentIdx];
  if(!f)return;
  var csv=buildCSV(f);
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.download=(f.id||'chart')+'.csv';
  a.href=url;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildCSV(f){
  var rows=[];
  if(Array.isArray(f.ohlc)){
    rows.push(['label','open','high','low','close']);
    f.ohlc.forEach(function(p){rows.push([p.label,p.open,p.high,p.low,p.close]);});
  } else if(Array.isArray(f.bubbles)){
    rows.push(['x','y','size','label']);
    f.bubbles.forEach(function(p){rows.push([p.x,p.y,p.size||p.r,p.label||'']);});
  } else if(Array.isArray(f.rangeData)){
    rows.push(['label','start','end']);
    f.rangeData.forEach(function(p){rows.push([p.label,p.start,p.end]);});
  } else if(Array.isArray(f.datasets)&&Array.isArray(f.labels)){
    rows.push(['label'].concat(f.datasets.map(function(d){return d.label;})));
    f.labels.forEach(function(label,i){
      rows.push([label].concat(f.datasets.map(function(d){return d.data[i];})));
    });
  } else if(Array.isArray(f.points)){
    rows.push(['x','y','label']);
    f.points.forEach(function(p){rows.push([p.x,p.y,p.label||'']);});
  } else {
    rows.push(['label','value']);
    (f.labels||[]).forEach(function(label,i){rows.push([label,(f.data||[])[i]]);});
  }
  return rows.map(function(row){return row.map(csvCell).join(',');}).join('\r\n');
}

function csvCell(value){
  var s=String(value==null?'':value);
  if(/[",\r\n]/.test(s))return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

(function(){

  var sx=0,sy=0,sw=0,sh=0,mode=null;  // mode: 'v' | 'h' | 'c' | null
  function startDrag(m){
    return function(e){
      e.preventDefault();
      mode=m;sx=e.clientX;sy=e.clientY;
      sw=wrap.offsetWidth;sh=wrap.offsetHeight;
      document.body.style.cursor=m==='v'?'ns-resize':m==='h'?'ew-resize':'nwse-resize';
      document.body.style.userSelect='none';
    };
  }
  hV.addEventListener('mousedown',startDrag('v'));
  hH.addEventListener('mousedown',startDrag('h'));
  hC.addEventListener('mousedown',startDrag('c'));
  document.addEventListener('mousemove',function(e){
    if(!mode)return;
    if(mode==='v'||mode==='c'){
      var nh=Math.max(200,Math.min(1400,sh+(e.clientY-sy)));
      wrap.style.height=nh+'px';
      var hi=document.getElementById('heightInput');if(hi)hi.value=Math.round(nh);
    }
    if(mode==='h'||mode==='c'){
      var nw=Math.max(200,Math.min(2400,sw+(e.clientX-sx)));
      wrap.style.width=nw+'px';
      var wi=document.getElementById('widthInput');if(wi)wi.value=Math.round(nw);
    }
    if(hint)hint.textContent=Math.round(wrap.offsetWidth)+' × '+Math.round(wrap.offsetHeight)+' px  —  drag edges or edit W/H';
    if(chart)chart.resize();
  });
  document.addEventListener('mouseup',function(){
    if(!mode)return;
    var f=FIGS[currentIdx];
    if(!dimensionsOverride[f.id])dimensionsOverride[f.id]={};
    if(mode==='v'||mode==='c')dimensionsOverride[f.id].h=wrap.offsetHeight;
    if(mode==='h'||mode==='c')dimensionsOverride[f.id].w=wrap.offsetWidth;
    mode=null;
    document.body.style.cursor='';document.body.style.userSelect='';
    queueSave();
  });
})();

loadState();
</script>
</body>
</html>
