<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autocharter — LBC Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-geo@4.3.6/build/index.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:#1B2A4A;display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;background:#f7f8fa;border-right:1px solid #e8e9ec;padding:20px 0;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-title{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#888;padding:0 20px;margin-bottom:16px}
.sb-section{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#b8bcc8;padding:14px 20px 4px;border-top:1px solid #eaecef;margin-top:6px}
.sb-section:first-of-type{border-top:0;margin-top:0;padding-top:0}
.fig-btn{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 20px;font-size:13px;color:#5a5e6b;cursor:pointer;border-left:3px solid transparent;transition:all .15s ease;font-family:inherit;line-height:1.4}
.fig-btn:hover{background:#eef0f4;color:#1B2A4A}
.fig-btn.active{background:#e8ecf4;color:#1B2A4A;font-weight:600;border-left-color:#8B2635}
.fig-btn .fig-num{font-size:11px;font-weight:600;color:#9aa0b0;display:block;margin-bottom:2px}
.fig-btn.active .fig-num{color:#8B2635}
.project-panel{padding:0 14px 14px;border-bottom:1px solid #eaecef;margin-bottom:8px}
.project-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#b8bcc8;margin-bottom:6px}
.project-select{width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:5px;background:#fff;color:#1B2A4A;font-family:inherit;font-size:12px;margin-bottom:8px}
.project-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:6px}
.project-btn{font-size:11px;padding:5px 6px;border:1px solid #d1d5db;background:#fff;color:#4b5563;border-radius:5px;cursor:pointer;font-family:inherit}
.project-btn:hover{background:#f3f4f6}
.project-btn.primary{grid-column:span 3;background:#8B2635;border-color:#8B2635;color:#fff}
.project-btn.active{background:#1B2A4A;border-color:#1B2A4A;color:#fff}
.sidebar-dynamic{padding-bottom:20px}
.category-header{display:flex;align-items:center;gap:6px}
.category-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.edit-chip{font-size:10px;padding:2px 5px;border:1px solid #d1d5db;background:#fff;color:#6b7280;border-radius:4px;cursor:pointer;font-family:inherit}
.edit-chip:hover{background:#f3f4f6;color:#1B2A4A}
.drag-handle{color:#9aa0b0;font-weight:700;cursor:grab;user-select:none}
.chart-item{position:relative}
.chart-item.drag-over,.category-block.drag-over{outline:1px dashed #8B2635;outline-offset:-2px;background:#fdf2f4}
.chart-edit-row{display:flex;gap:5px;align-items:center;padding:0 14px 6px 20px}
.chart-edit-row select{min-width:0;flex:1;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;background:#fff;color:#1B2A4A;font-family:inherit;font-size:11px}
.empty-category{font-size:12px;color:#b8bcc8;padding:8px 20px}
.main{flex:1;padding:28px 36px;overflow-y:auto;display:flex;flex-direction:column}
.chart-header{margin-bottom:14px}
.chart-title{font-size:18px;font-weight:600;color:#1B2A4A;margin-bottom:4px}
.chart-subtitle{font-size:13px;color:#888;font-weight:400}
.editable-line{display:inline-flex;align-items:center;gap:7px;max-width:100%}
.editable-text{min-width:0;overflow-wrap:anywhere}
.edit-pencil{border:0;background:transparent;color:#9ca3af;opacity:.28;cursor:pointer;font-size:13px;line-height:1;padding:2px 3px;border-radius:4px;font-family:inherit;transition:opacity .12s,color .12s,background .12s}
.editable-line:hover .edit-pencil,.edit-pencil:focus{opacity:1;color:#8B2635;background:#f3f4f6;outline:none}
.inline-edit-input{font:inherit;color:inherit;border:1px solid #d1d5db;border-radius:4px;padding:3px 6px;background:#fff;min-width:260px;max-width:min(760px,80vw)}
.chart-source .inline-edit-input{font-size:11px;color:#6b7280}

.controls{display:flex;flex-wrap:wrap;gap:10px 18px;padding:10px 14px;background:#fafbfc;border:1px solid #e8e9ec;border-radius:6px;margin-bottom:14px;align-items:center;font-size:12px}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-group.hidden{display:none}
.hidden{display:none!important}
.ctrl-group label{color:#5a5e6b;font-weight:500;user-select:none;cursor:pointer}
.ctrl-group input[type="checkbox"]{cursor:pointer;accent-color:#8B2635}
.ctrl-group select{padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;font-family:inherit;background:#fff;color:#1B2A4A;cursor:pointer}
.ctrl-group input[type="color"]{width:30px;height:24px;border:1px solid #d1d5db;border-radius:4px;padding:1px;cursor:pointer;background:#fff}
.thickness-slider{width:96px;accent-color:#8B2635}
.thickness-input{width:48px;padding:3px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;font-family:inherit;color:#1B2A4A;background:#fff;-moz-appearance:textfield}
.thickness-input::-webkit-outer-spin-button,.thickness-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.thickness-input:focus{outline:none;border-color:#8B2635}
.ctrl-divider{width:1px;height:22px;background:#e0e2e6}
.ctrl-reset{font-size:11px;padding:4px 10px;border:1px solid #d1d5db;background:#fff;color:#6b7280;border-radius:4px;cursor:pointer;font-family:inherit}
.ctrl-reset:hover{background:#f3f4f6;color:#1B2A4A}
.sync-badge{font-size:11px;padding:4px 10px;border-radius:12px;background:#f3f4f6;color:#6b7280;font-weight:600;margin-left:auto;white-space:nowrap;letter-spacing:0.3px}
.sync-badge.loading,.sync-badge.syncing,.sync-badge.pending{background:#fef3c7;color:#92400e}
.sync-badge.synced{background:#d1fae5;color:#065f46}
.sync-badge.error{background:#fee2e2;color:#991b1b}

.chart-stage{display:flex;flex-direction:column;align-items:stretch;max-width:100%}
.chart-stage.legend-right-stage{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:16px}
.chart-stage.legend-right-stage .chart-wrap{grid-column:1;grid-row:1}
.chart-stage.legend-right-stage .legend-row{grid-column:2;grid-row:1;max-width:190px;margin-bottom:0}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px;font-size:12px;color:#6b7280}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{width:11px;height:11px;border-radius:2px;flex-shrink:0}

.chart-wrap{position:relative;width:100%;min-height:200px;height:460px;max-width:100%;overflow:hidden;border:1px solid transparent;border-radius:4px;transition:border-color .15s;flex-shrink:0}
.chart-wrap:hover{border-color:#e0e2e6}
.resize-handle{position:absolute;bottom:0;left:0;right:12px;height:12px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;background:linear-gradient(transparent,rgba(0,0,0,.02))}
.chart-wrap:hover .resize-handle{opacity:1}
.resize-dots{display:flex;gap:3px}
.resize-dots span{width:4px;height:4px;border-radius:50%;background:#bbb}
.resize-handle-r{position:absolute;top:0;right:0;bottom:12px;width:12px;cursor:ew-resize;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;background:linear-gradient(90deg,transparent,rgba(0,0,0,.02))}
.chart-wrap:hover .resize-handle-r{opacity:1}
.resize-dots-v{display:flex;flex-direction:column;gap:3px}
.resize-dots-v span{width:4px;height:4px;border-radius:50%;background:#bbb}
.resize-corner{position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize;opacity:0;transition:opacity .15s;background:linear-gradient(135deg,transparent 50%,#bbb 50%,#bbb 60%,transparent 60%,transparent 70%,#bbb 70%,#bbb 80%,transparent 80%)}
.chart-wrap:hover .resize-corner{opacity:.6}
.size-input{width:58px;padding:3px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;font-family:inherit;color:#1B2A4A;background:#fff;-moz-appearance:textfield}
.size-input::-webkit-outer-spin-button,.size-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.size-input:focus{outline:none;border-color:#8B2635}
.size-unit{font-size:11px;color:#9ca3af}
.ctrl-reset-size{font-size:10px;padding:2px 6px;border:1px solid #d1d5db;background:#fff;color:#6b7280;border-radius:4px;cursor:pointer;font-family:inherit}
.ctrl-reset-size:hover{background:#f3f4f6}
.chart-source{font-size:11px;color:#aaa;margin-top:10px}
.export-row{display:flex;gap:8px;margin-top:14px;align-items:center}
.export-btn{font-size:12px;padding:6px 14px;border:1px solid #d1d5db;background:#fff;color:#4b5563;border-radius:6px;cursor:pointer;font-family:inherit;transition:all .12s}
.export-btn:hover{background:#f3f4f6;border-color:#9ca3af}
.size-hint{font-size:11px;color:#ccc;margin-top:4px}
.import-panel{border:1px solid #e8e9ec;background:#fafbfc;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#4b5563;line-height:1.5}
.import-panel-title{font-weight:700;color:#1B2A4A;margin-bottom:4px}
.import-panel-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.import-panel select{padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;font-family:inherit;background:#fff;color:#1B2A4A}
.import-action{font-size:12px;padding:5px 10px;border:1px solid #d1d5db;background:#fff;color:#4b5563;border-radius:5px;cursor:pointer;font-family:inherit}
.import-action.primary{background:#8B2635;border-color:#8B2635;color:#fff}
.import-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}
.import-field{display:flex;flex-direction:column;gap:3px}
.import-field label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px}
.import-warning{color:#92400e}
.import-error{color:#991b1b}
.upload-chart-buttons:empty{display:none}
.data-editor-panel{border:1px solid #e8e9ec;background:#fff;border-radius:6px;padding:12px;margin-bottom:12px;font-size:12px;color:#4b5563;line-height:1.4}
.data-editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.data-editor-title{font-weight:700;color:#1B2A4A;margin-bottom:2px}
.data-editor-meta{font-size:11px;color:#8a90a0}
.data-editor-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.data-editor-btn{font-size:12px;padding:5px 10px;border:1px solid #d1d5db;background:#fff;color:#4b5563;border-radius:5px;cursor:pointer;font-family:inherit}
.data-editor-btn:hover{background:#f3f4f6}
.data-editor-btn.primary{background:#8B2635;border-color:#8B2635;color:#fff}
.data-editor-btn:disabled{opacity:.45;cursor:not-allowed;background:#f3f4f6;color:#9ca3af}
.data-editor-grid-wrap{max-height:340px;overflow:auto;border:1px solid #e5e7eb;border-radius:5px;background:#fff}
.data-editor-table{width:100%;border-collapse:collapse;min-width:520px}
.data-editor-table th,.data-editor-table td{border-bottom:1px solid #eef0f4;border-right:1px solid #eef0f4;padding:0;background:#fff}
.data-editor-table th{position:sticky;top:0;z-index:1;background:#f9fafb}
.data-editor-table th:last-child,.data-editor-table td:last-child{border-right:0}
.data-editor-input{width:100%;min-width:92px;border:0;background:transparent;color:#1B2A4A;font:inherit;padding:7px 8px;outline:none}
.data-editor-input:focus{background:#fff7f8;box-shadow:inset 0 0 0 1px #8B2635}
.data-editor-header-input{font-weight:700;color:#4b5563;text-transform:none}
.data-editor-row-action{width:42px;text-align:center;background:#fafbfc!important}
.data-editor-delete{border:0;background:transparent;color:#9ca3af;cursor:pointer;font-size:16px;line-height:1;padding:4px 8px}
.data-editor-delete:hover{color:#8B2635}
.data-editor-status{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:11px}
.data-editor-error{color:#991b1b}
.data-editor-warning{color:#92400e}
.data-editor-ok{color:#065f46}
.format-panel{border:1px solid #e8e9ec;background:#fff;border-radius:6px;padding:12px;margin-bottom:12px;font-size:12px;color:#4b5563}
.format-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.format-panel-title{font-weight:700;color:#1B2A4A}
.format-panel-note{font-size:11px;color:#8a90a0;margin-top:3px}
.format-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.format-section{border:1px solid #eef0f4;border-radius:6px;padding:10px;background:#fafbfc}
.format-section-title{font-size:11px;font-weight:700;color:#1B2A4A;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.format-row{display:grid;grid-template-columns:minmax(72px,auto) 1fr;gap:6px;align-items:center;margin-bottom:6px}
.format-row:last-child{margin-bottom:0}
.format-row label{font-size:11px;font-weight:600;color:#6b7280}
.format-row input,.format-row select{min-width:0;width:100%;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;background:#fff;color:#1B2A4A;font:inherit;font-size:12px}
.format-row input[type="checkbox"]{width:auto;justify-self:start;accent-color:#8B2635}
.format-row-inline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.format-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.format-btn{font-size:11px;padding:5px 10px;border:1px solid #d1d5db;background:#fff;color:#4b5563;border-radius:5px;cursor:pointer;font-family:inherit}
.format-btn:hover{background:#f3f4f6}
.legend-row.legend-hidden{display:none}
.legend-row.legend-bottom{order:2;margin-top:10px;margin-bottom:0}
.legend-row.legend-right{flex-direction:column;align-items:flex-start;gap:7px}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-title">Autocharter</div>
  <div class="project-panel">
    <div class="project-label">Project</div>
    <select id="projectSelect" class="project-select" onchange="onProjectSelectChange()"></select>
    <div class="project-actions">
      <button class="project-btn" id="newProjectBtn" onclick="newProject()">New</button>
      <button class="project-btn" id="renameProjectBtn" onclick="renameProject()">Rename</button>
      <button class="project-btn" id="saveProjectBtn" onclick="saveProjectFile()">Save</button>
      <button class="project-btn" id="loadProjectBtn" onclick="loadProjectFile()">Load</button>
      <button class="project-btn" id="editModeBtn" onclick="toggleEditMode()">Edit</button>
      <button class="project-btn" id="addCategoryBtn" onclick="addCategory()">+ Cat</button>
      <button class="project-btn primary" id="addChartBtn" onclick="openDataUpload()">+ Add Chart</button>
    </div>
    <input type="file" id="projectFileInput" class="hidden" accept=".json" onchange="onProjectFileSelected(event)">
  </div>
  <div class="sidebar-dynamic" id="sidebarCharts"></div>
</div>
<div class="main">
  <div class="chart-header">
    <div class="chart-title" id="cTitle"></div>
    <div class="chart-subtitle" id="cSubtitle"></div>
  </div>
  <div class="controls">
    <div class="ctrl-group">
      <input type="checkbox" id="showLabels" onchange="onLabelsCheckChange()">
      <label for="showLabels">Data Labels</label>
    </div>
    <div class="ctrl-group hidden" id="dotsGroup">
      <input type="checkbox" id="showDots" onchange="onDotsCheckChange()">
      <label for="showDots">Dots</label>
    </div>
    <div class="ctrl-group">
      <label for="labelStyle">Style:</label>
      <select id="labelStyle" onchange="onLabelStyleChange()">
        <option value="simple" selected>No Background</option>
        <option value="boxed">White Background</option>
      </select>
    </div>
    <div class="ctrl-divider"></div>
    <div class="ctrl-group" id="chartTypeGroup">
      <label for="chartTypeSelect">Chart:</label>
      <select id="chartTypeSelect" onchange="onChartTypeChange()"></select>
    </div>
    <div class="ctrl-group hidden" id="lineThicknessGroup">
      <label for="lineThicknessRange">Line:</label>
      <input type="range" id="lineThicknessRange" class="thickness-slider" min="1" max="8" step="0.5" oninput="onLineThicknessInput(this.value)">
      <input type="number" id="lineThicknessInput" class="thickness-input" min="1" max="8" step="0.5" onchange="onLineThicknessInput(this.value)">
      <span class="size-unit">px</span>
    </div>
    <div class="ctrl-divider"></div>
    <div class="ctrl-group" id="colorControls"></div>
    <div class="ctrl-divider"></div>
    <button class="ctrl-reset" onclick="resetColors()">Reset Colors</button>
    <button class="ctrl-reset" id="formatToggleBtn" onclick="toggleFormatPanel()">Format</button>
    <div class="ctrl-divider"></div>
    <div class="ctrl-group">
      <label for="widthInput">W:</label>
      <input type="number" id="widthInput" class="size-input" min="200" max="2400" step="10" onchange="onWidthInput()">
      <span class="size-unit">px</span>
      <label for="heightInput">H:</label>
      <input type="number" id="heightInput" class="size-input" min="200" max="1400" step="10" onchange="onHeightInput()">
      <span class="size-unit">px</span>
      <button class="ctrl-reset-size" onclick="resetSize()" title="Reset to default size">↺</button>
    </div>
    <div class="sync-badge" id="syncBadge" title="Settings saved to this browser's local storage">○ Loading...</div>
  </div>
  <div class="format-panel hidden" id="formatPanel"></div>
  <div class="import-panel hidden" id="importPanel"></div>
  <div class="data-editor-panel hidden" id="dataEditorPanel"></div>
  <div class="chart-stage" id="chartStage">
    <div class="legend-row" id="cLegend"></div>
    <div class="chart-wrap" id="chartWrap">
      <canvas id="mainCanvas"></canvas>
      <div class="resize-handle" id="resizeHandle"><div class="resize-dots"><span></span><span></span><span></span></div></div>
      <div class="resize-handle-r" id="resizeHandleR"><div class="resize-dots-v"><span></span><span></span><span></span></div></div>
      <div class="resize-corner" id="resizeCorner"></div>
    </div>
  </div>
  <div class="size-hint" id="sizeHint">Drag edges or edit W/H to resize</div>
  <div class="chart-source" id="cSource"></div>
  <div class="export-row">
    <button class="export-btn" id="addDataFileBtn" onclick="openDataUpload()">Add CSV/XLSX</button>
    <input type="file" id="dataFileInput" class="hidden" accept=".csv,.txt,.tsv,.xlsx,.xls" onchange="onDataFileSelected(event)">
    <button class="export-btn" id="editDataBtn" onclick="openDataEditor()">Edit Data</button>
    <button class="export-btn" id="exportPngBtn" onclick="exportPNG()">Export PNG</button>
    <button class="export-btn" id="downloadCsvBtn" onclick="downloadCSV()">Download CSV</button>
  </div>
</div>
<script>
Chart.register(ChartDataLabels);

// ================================================================================
// =============================== LOCAL STORAGE ==================================
// ================================================================================
// Settings (colors, label style, label visibility, chart dimensions) are saved
// to your browser's localStorage. Per-device — no server, no sync, no setup.
// Clear via browser devtools if you want to reset everything.
var STORAGE_KEY='pdrbGalleryState';
var PROJECT_STORAGE_KEY='lbcAutocharterWorkspace';
var syncReady=false;
// ================================================================================

// Per-chart override for the "Data Labels" checkbox (persisted across sessions)
var labelsShownOverride={};
// Per-chart override for the "Dots" checkbox on line charts (persisted across sessions)
var dotsShownOverride={};
function getDotsShown(idx){
  var f=FIGS[idx];if(!f)return true;
  return dotsShownOverride[f.id]!==undefined?dotsShownOverride[f.id]:(f.dotsDefault!==false);
}
function getLabelsShown(idx){
  var f=FIGS[idx];
  if(!f)return false;
  return labelsShownOverride[f.id]!==undefined?labelsShownOverride[f.id]:f.labelsDefault;
}

// Per-chart chart type and line width overrides (persisted across sessions)
var chartTypeOverride={};
var lineThicknessOverride={};
var chartFormatOverride={};
var formatPanelOpen=false;

// Per-chart dimension overrides: { figId: { w: px|null, h: px } }
// w=null means "fill parent width"; h falls back to f.height then 460.
var dimensionsOverride={};
function getDimensions(idx){
  var f=FIGS[idx];
  if(!f)return {w:null,h:460};
  var ov=dimensionsOverride[f.id]||{};
  return {w: ov.w||null, h: ov.h||f.height||460};
}
function applyDimensions(){
  var d=getDimensions(currentIdx);
  var cw=document.getElementById('chartWrap');
  cw.style.width=d.w?d.w+'px':'100%';
  cw.style.height=d.h+'px';
  var hint=document.getElementById('sizeHint');
  if(hint)hint.textContent=Math.round(cw.offsetWidth)+' × '+Math.round(cw.offsetHeight)+' px  —  drag edges or edit W/H';
  if(chart)chart.resize();
}
function syncSizeInputs(){
  var d=getDimensions(currentIdx);
  var cw=document.getElementById('chartWrap');
  var wi=document.getElementById('widthInput');
  var hi=document.getElementById('heightInput');
  if(wi)wi.value=d.w||Math.round(cw.offsetWidth);
  if(hi)hi.value=d.h;
}

function setSyncStatus(s){
  var b=document.getElementById('syncBadge');if(!b)return;
  b.className='sync-badge';
  b.title='';
  if(s==='saving'||s==='pending'){b.classList.add('pending');b.textContent='⟳ Saving...';}
  else if(s==='saved') {b.classList.add('synced'); b.textContent='✓ Saved';}
  else if(s==='error') {b.classList.add('error');  b.textContent='⚠ Error';}
  else                 {b.textContent='○ Loading...';}
}

function captureSettings(){
  var c={};
  FIGS.forEach(function(f,i){c[f.id]=Object.assign({},colorState[i]);});
  return {
    colors:c,
    labelStyle:document.getElementById('labelStyle').value,
    labelsShownOverride:Object.assign({},labelsShownOverride),
    dotsShownOverride:Object.assign({},dotsShownOverride),
    dimensionsOverride:Object.assign({},dimensionsOverride),
    chartTypeOverride:Object.assign({},chartTypeOverride),
    lineThicknessOverride:Object.assign({},lineThicknessOverride),
    chartFormatOverride:JSON.parse(JSON.stringify(chartFormatOverride||{}))
  };
}

function gatherState(){
  persistActiveProjectSettings();
  return {
    version:1,
    activeProjectId:activeProjectId,
    projects:projects.map(serializeProject)
  };
}

function applyState(state){
  if(!state)return;
  if(state.colors){
    FIGS.forEach(function(f,i){
      var saved=state.colors[f.id];if(!saved)return;
      Object.keys(saved).forEach(function(k){
        if(colorState[i].hasOwnProperty(k))colorState[i][k]=saved[k];
      });
    });
  }
  if(state.labelStyle){
    var sel=document.getElementById('labelStyle');
    if(sel)sel.value=state.labelStyle;
  }
  if(state.labelsShownOverride){
    Object.assign(labelsShownOverride,state.labelsShownOverride);
  }
  if(state.dotsShownOverride){
    Object.assign(dotsShownOverride,state.dotsShownOverride);
  }
  if(state.dimensionsOverride){
    Object.assign(dimensionsOverride,state.dimensionsOverride);
  }
  if(state.chartTypeOverride){
    Object.assign(chartTypeOverride,state.chartTypeOverride);
  }
  if(state.lineThicknessOverride){
    Object.assign(lineThicknessOverride,state.lineThicknessOverride);
  }
  if(state.chartFormatOverride){
    chartFormatOverride=JSON.parse(JSON.stringify(state.chartFormatOverride));
  }
}

function restoreSettings(settings){
  settings=settings||{};
  labelsShownOverride=Object.assign({},settings.labelsShownOverride||{});
  dotsShownOverride=Object.assign({},settings.dotsShownOverride||{});
  dimensionsOverride=Object.assign({},settings.dimensionsOverride||{});
  chartTypeOverride=Object.assign({},settings.chartTypeOverride||{});
  lineThicknessOverride=Object.assign({},settings.lineThicknessOverride||{});
  chartFormatOverride=JSON.parse(JSON.stringify(settings.chartFormatOverride||{}));
  if(settings.labelStyle){
    var sel=document.getElementById('labelStyle');
    if(sel)sel.value=settings.labelStyle;
  }
  FIGS.forEach(function(f,i){
    var defaults=f.colors.reduce(function(o,c){o[c.key]=c.def;return o},{});
    var saved=settings.colors&&settings.colors[f.id];
    colorState[i]=Object.assign(defaults,saved||{});
  });
}

function loadState(){
  try{
    initializeProjectWorkspace();
  }catch(e){
    console.error('localStorage load failed:',e);
    createFallbackWorkspace();
  }
  syncReady=true;
  renderProjectSelect();
  renderSidebar();
  if(FIGS.length)showChart(Math.max(0,Math.min(currentIdx,FIGS.length-1)));
  else showChart(-1);
  setSyncStatus('saved');
}

var saveTimer=null;
function queueSave(){
  if(!syncReady)return;
  setSyncStatus('pending');
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(saveState,300);
}

function saveState(){
  try{
    localStorage.setItem(PROJECT_STORAGE_KEY,JSON.stringify(gatherState()));
    setSyncStatus('saved');
  }catch(e){
    console.error('localStorage save failed:',e);
    setSyncStatus('error');
  }
}

function syncDotsControl(){
  var group=document.getElementById('dotsGroup');
  var box=document.getElementById('showDots');
  if(!group||!box)return;
  var f=FIGS[currentIdx];
  if(!f){group.classList.add('hidden');return;}

  }
  group.classList.remove('hidden');
  box.checked=getDotsShown(currentIdx);
}

}


// Reference-line plugin (vertical dashed line at a given x-value, e.g. LDR threshold=100)
var refLinePlugin={
  id:'refLine',
  afterDatasetsDraw:function(chart){
    var opts=chart.options.plugins&&chart.options.plugins.refLine;
    if(!opts||opts.value==null)return;
    var sx=chart.scales.x;if(!sx)return;
    var x=sx.getPixelForValue(opts.value);
    var c=chart.ctx;
    c.save();
    c.strokeStyle=opts.color||'#dc2626';
    c.lineWidth=opts.lineWidth||1.5;
    c.setLineDash(opts.dash||[5,5]);
    c.beginPath();
    c.moveTo(x,chart.chartArea.top);
    c.lineTo(x,chart.chartArea.bottom);
    c.stroke();
    c.restore();
  }
};
Chart.register(refLinePlugin);

function isValidUploadedFig(f){
  return !!(f&&f.id&&f.title&&f.type&&Array.isArray(f.colors)&&(
    Array.isArray(f.data)||
    Array.isArray(f.points)||
    Array.isArray(f.datasets)||
    Array.isArray(f.bubbles)||
    Array.isArray(f.rangeData)||
    Array.isArray(f.ohlc)
  ));
}

function cloneFig(f){
  var clone=Object.assign({},f);
  ['labels','data','points','colors','datasets','allowedTypes','bubbles','rangeData','ohlc'].forEach(function(k){
    if(Array.isArray(f[k]))clone[k]=JSON.parse(JSON.stringify(f[k]));
  });
  if(f.trend)clone.trend=Object.assign({},f.trend);
  if(f.refLine)clone.refLine=JSON.parse(JSON.stringify(f.refLine));
  return clone;
}

function hydrateFig(f){
  if(!f)return null;
  var base=f.builtInId&&BUILTIN_BY_ID[f.builtInId]?cloneFig(BUILTIN_BY_ID[f.builtInId]):{};
  var hydrated=Object.assign(base,f);
  ['labels','data','points','colors','datasets','allowedTypes','bubbles','rangeData','ohlc'].forEach(function(k){
    if(Array.isArray(f[k]))hydrated[k]=JSON.parse(JSON.stringify(f[k]));
  });
  if(f.trend)hydrated.trend=Object.assign({},f.trend);
  if(f.refLine)hydrated.refLine=JSON.parse(JSON.stringify(f.refLine));
  return hydrated;
}

function serializeFig(f){
  var copy={};
  Object.keys(f).forEach(function(k){
    if(typeof f[k]!=='function')copy[k]=f[k];
  });
  return copy;
}

function makeId(prefix,name){
  return prefix+'_'+String(name||Date.now()).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)+'_'+Math.random().toString(36).slice(2,7);
}

function makeDeterministicId(prefix,name){
  return prefix+'_'+String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,64);
}

function getFixtureDefinition(fileName){
  return QA_FIXTURE_INDEX[fileName]||null;
}

function getImportedFigureResult(rawRows,fileName,meta){
  var normalized=normalizeImportedRows(rawRows);
  if(!normalized.rows.length){
    return {errorTitle:'No usable rows found',errorMessage:'The file only contained blank rows.'};
  }
  var wide=detectWideTimeSeries(normalized.rows,normalized.stats,fileName,meta||{});
  if(wide)return wide;
  var table=prepareTable(normalized.rows,normalized.stats);
  return detectLongTable(table,fileName,meta||{});
}

function buildSeedFigureFromSpec(projectId,categoryId,chartSpec,index){
  var fixture=getFixtureDefinition(chartSpec.fixture);
  if(!fixture)throw new Error('Missing fixture definition for '+chartSpec.fixture);
  var rawRows=parseCSV(fixture.csv);
  var meta={seedProjectId:projectId,fixtureFile:fixture.fileName};
  var result;
  if(chartSpec.mode==='manual'){
    var normalized=normalizeImportedRows(rawRows);
    var table=prepareTable(normalized.rows,normalized.stats);
    result=buildFigFromColumns(table,chartSpec.map,fixture.fileName,meta,'seed',chartSpec.warnings||[]);
  } else {
    result=getImportedFigureResult(rawRows,fixture.fileName,meta);
  }
  if(!result||!result.fig)throw new Error('Could not build seeded figure for '+fixture.fileName);
  var fig=hydrateFig(result.fig);
  fig.id=chartSpec.id;
  fig.uploaded=true;
  fig.categoryId=categoryId;
  fig.figureLabel='Upload '+(index+1);
  fig.fixtureFile=fixture.fileName;
  fig.fixtureShape=fixture.expectedShape;
  fig.expectedType=chartSpec.defaultType||fixture.expectedType||fig.defaultType||inferDefaultChartType(fig);
  fig.seedProjectId=projectId;
  fig.title=chartSpec.title||fig.title;
  fig.sub=chartSpec.sub||fig.sub||('Imported from '+fixture.fileName);
  fig.src='Uploaded file: '+fixture.fileName+' (built-in demo)';
  if(chartSpec.defaultType)fig.defaultType=chartSpec.defaultType;
  if(chartSpec.intendedType)fig.intendedType=chartSpec.intendedType;
  if(chartSpec.allowedTypes)fig.allowedTypes=chartSpec.allowedTypes.slice();
  if(chartSpec.override){
    Object.keys(chartSpec.override).forEach(function(key){fig[key]=chartSpec.override[key];});
  }
  return fig;
}

function createDemoProject(spec){

function createSeedProject(legacyState){
  var categoryByChart={};
  CATEGORY_SEEDS.forEach(function(cat){cat.chartIds.forEach(function(id){categoryByChart[id]=cat.id;});});
  var charts=BUILTIN_FIGS.map(function(f,i){
    var fig=cloneFig(f);
    fig.builtInId=f.id;
    fig.categoryId=categoryByChart[f.id]||'cat_uncategorized';
    fig.figureLabel='Fig. '+(i+1);
    return fig;
  });
  if(legacyState&&Array.isArray(legacyState.uploadedFigs)){
    legacyState.uploadedFigs.filter(isValidUploadedFig).forEach(function(f,i){
      var fig=hydrateFig(f);
      fig.uploaded=true;
      fig.categoryId='cat_uploads';
      fig.figureLabel=fig.figureLabel||('Upload '+(i+1));
      charts.push(fig);
    });
  }
  var categories=CATEGORY_SEEDS.map(function(cat){return {id:cat.id,name:cat.name};});
  categories.push({id:'cat_uploads',name:'Uploads'});
  categories.push({id:'cat_uncategorized',name:'Uncategorized'});
  return {
    id:'project_indonesia_regional_data',
    name:'Indonesia Regional Data',
    categories:categories,
    charts:charts,
    settings:legacyState?legacyState:{}
  };
}

function normalizeProject(project){
  if(!project)return;
  if(!Array.isArray(project.categories))project.categories=[];
  if(!project.categories.some(function(c){return c.id==='cat_uncategorized';})){
    project.categories.push({id:'cat_uncategorized',name:'Uncategorized'});
  }
  var catIds=project.categories.reduce(function(o,c){o[c.id]=true;return o;},{});
  (project.charts||[]).forEach(function(f,i){
    repairBuiltInChartData(f);
    if(!catIds[f.categoryId])f.categoryId='cat_uncategorized';
    if(!f.figureLabel)f.figureLabel=f.uploaded?('Upload '+(i+1)):('Fig. '+(i+1));
  });
}

function repairBuiltInChartData(f){
  if(!f||f.uploaded)return;
  var baseId=f.builtInId||f.id;
  var base=BUILTIN_BY_ID[baseId];
  if(!base)return;
  var changed=false;
  var hasBaseCategory=Array.isArray(base.labels)&&Array.isArray(base.data);
  if(hasBaseCategory){
    var labelsBad=!Array.isArray(f.labels)||!f.labels.length||labelsAreOnlyIndexes(f.labels)||labelsAreBlank(f.labels);
    var dataBad=!Array.isArray(f.data)||!f.data.length||!f.data.some(isFiniteNumberValue);
    var lengthBad=Array.isArray(f.labels)&&Array.isArray(f.data)&&f.labels.length!==f.data.length;
    if(labelsBad||lengthBad){f.labels=base.labels.slice();changed=true;}
    if(dataBad||lengthBad){f.data=base.data.slice();changed=true;}
    if(Array.isArray(f.labels)&&Array.isArray(f.data)&&f.labels.length!==f.data.length){
      f.labels=base.labels.slice();
      f.data=base.data.slice();
      changed=true;
    }
  } else if(Array.isArray(base.labels)&&(!Array.isArray(f.labels)||!f.labels.length||labelsAreOnlyIndexes(f.labels)||labelsAreBlank(f.labels))){
    f.labels=base.labels.slice();
    changed=true;
  }
  if(Array.isArray(base.datasets)&&!hasUsableMultiSeries(f)){
    f.datasets=JSON.parse(JSON.stringify(base.datasets));
    if(Array.isArray(base.labels))f.labels=base.labels.slice();
    changed=true;
  }
  if(Array.isArray(base.points)&&(!Array.isArray(f.points)||!f.points.length)){f.points=JSON.parse(JSON.stringify(base.points));changed=true;}
  if(Array.isArray(base.bubbles)&&(!Array.isArray(f.bubbles)||!f.bubbles.length)){f.bubbles=JSON.parse(JSON.stringify(base.bubbles));changed=true;}
  if(Array.isArray(base.rangeData)&&(!Array.isArray(f.rangeData)||!f.rangeData.length)){f.rangeData=JSON.parse(JSON.stringify(base.rangeData));changed=true;}
  if(Array.isArray(base.ohlc)&&(!Array.isArray(f.ohlc)||!f.ohlc.length)){f.ohlc=JSON.parse(JSON.stringify(base.ohlc));changed=true;}
  if(base.trend&&!f.trend){f.trend=Object.assign({},base.trend);changed=true;}
  if(base.xLabel&&(!f.xLabel||String(f.xLabel).toLowerCase()==='value')){f.xLabel=base.xLabel;changed=true;}
  if(base.yLabel&&(!f.yLabel||String(f.yLabel).toLowerCase()==='value')){f.yLabel=base.yLabel;changed=true;}
  return changed;
}

function isFiniteNumberValue(v){
  return typeof v==='number'&&isFinite(v);
}

function labelsAreOnlyIndexes(labels){
  return Array.isArray(labels)&&labels.length>0&&labels.every(function(label,i){
    return String(label).trim()===String(i);
  });
}

function labelsAreBlank(labels){
  return Array.isArray(labels)&&labels.length>0&&labels.every(function(label){
    return !String(label==null?'':label).trim();
  });
}

function hasUsableCategorySeries(f){
  return !!(f&&Array.isArray(f.labels)&&Array.isArray(f.data)&&f.labels.length>0&&
    f.labels.length===f.data.length&&!labelsAreBlank(f.labels)&&!labelsAreOnlyIndexes(f.labels)&&
    f.data.some(isFiniteNumberValue));
}

function hasUsableMultiSeries(f){
  return !!(f&&Array.isArray(f.labels)&&f.labels.length>0&&Array.isArray(f.datasets)&&f.datasets.length>0&&
    f.datasets.some(function(d){return Array.isArray(d.data)&&d.data.some(isFiniteNumberValue);}));
}

  normalizeProject(project);
  FIGS=project.charts||[];
  colorState=FIGS.map(function(f){
    return (f.colors||[]).reduce(function(o,c){o[c.key]=c.def;return o},{});
  });
  restoreSettings(project.settings||{});
}

function initializeProjectWorkspace(){
  var raw=localStorage.getItem(PROJECT_STORAGE_KEY);
  if(raw){
    var parsed=JSON.parse(raw);
    projects=(parsed.projects||[]).map(hydrateProject);
    activeProjectId=parsed.activeProjectId;
    if(hasGhaffarProjectData())ensureGhaffarProject(projects);
    else ensureBuiltInDemoProjects(projects);
  }
  if(!projects.length){
    if(hasGhaffarProjectData()){
      projects=[createGhaffarProject()];
    } else {
      var legacy=null;
      try{
        var legacyRaw=localStorage.getItem(STORAGE_KEY);
        if(legacyRaw)legacy=JSON.parse(legacyRaw);
      }catch(e){}
      projects=[createSeedProject(legacy)].concat(createBuiltInDemoProjects());
    }
    activeProjectId=projects[0].id;
  }
  if(!projects.some(function(p){return p.id===activeProjectId;}))activeProjectId=projects[0].id;
  applyProject(getActiveProject());
}

function createFallbackWorkspace(){
  projects=hasGhaffarProjectData()?[createGhaffarProject()]:[createSeedProject(null)].concat(createBuiltInDemoProjects());
  activeProjectId=projects[0].id;
  applyProject(projects[0]);
}

var TYPE_LABELS=Object.keys(CHART_TYPE_REGISTRY).reduce(function(o,k){o[k]=CHART_TYPE_REGISTRY[k].label;return o;},{});

function getChartTypeDef(type){
  return CHART_TYPE_REGISTRY[type]||null;
}

function isTypeImplemented(type){
  var def=getChartTypeDef(type);
  return !!(def&&(def.status==='implemented'||def.status==='v1')&&def.renderer&&CHART_RENDERERS[def.renderer]);
}

function getRenderableChartType(type){
  var seen={};
  while(type&&!isTypeImplemented(type)&&!seen[type]){
    seen[type]=true;
    var def=getChartTypeDef(type);
    type=def&&def.fallbackType;
  }
  return type&&isTypeImplemented(type)?type:'bar';
}

function isYearSeries(labels){
  return Array.isArray(labels)&&labels.length>1&&labels.every(function(label){
    return /^\d{4}[AEF]?$/.test(String(label));
  });
}

function hasCategorySeries(f){
  if(f&&!f.uploaded)repairBuiltInChartData(f);
  return hasUsableCategorySeries(f);
}

function hasScatterSeries(f){
  return Array.isArray(f.points)&&f.points.length>0;
}

function inferDefaultChartType(f){
  if(f.defaultType)return f.defaultType;
  if(f.intendedType)return f.intendedType;
  if(hasScatterSeries(f))return 'scatter';
  if(isYearSeries(f.labels))return 'line';
  if(Array.isArray(f.ohlc))return 'stock';
  if(Array.isArray(f.bubbles))return 'bubble';
  if(Array.isArray(f.rangeData))return 'range';
  if(f.dataShape==='multiSeries')return 'grouped-column';
  if(f.dataShape==='partWholeSeries')return 'pie';
  if(f.type==='line-simple')return 'line';
  if(f.type==='vbar-simple')return 'column';
  if(f.type==='hbar-simple')return 'bar';
  if(f.type==='stacked100-hbar')return 'stacked-bar-100';
  return null;
}

function getAllowedChartTypes(f){
  if(Array.isArray(f.allowedTypes))return f.allowedTypes.slice();
  if(f.type==='stacked100-hbar')return ['stacked-bar-100','stacked-bar','stacked-column-100','stacked-column'];
  if(Array.isArray(f.ohlc))return ['stock','line','column'];
  if(Array.isArray(f.bubbles))return ['bubble','scatter','surface'];
  if(Array.isArray(f.rangeData))return ['range','arrow','bullet-bar','bar','column'];
  if(f.dataShape==='multiSeries')return ['grouped-column','grouped-bar','stacked-column','stacked-column-100','stacked-bar','stacked-bar-100','split-bar','multiple-lines','stacked-area','stacked-area-100','combo','radar','multiple-pies','multiple-donuts','box-whisker','table'];
  if(f.dataShape==='partWholeSeries')return ['pie','donut','election-donut','treemap','sunburst','bar','column','funnel','table'];
  if(f.dataShape==='geoSeries')return [f.intendedType||'choropleth-map','choropleth-map','symbol-map','locator-map','excel-map','bar','table'];
  if(hasScatterSeries(f))return ['scatter','line'];
  if(hasCategorySeries(f))return ['bar','column','line','area','dot','pie','donut','election-donut','treemap','sunburst','funnel','waterfall','histogram','pareto','bullet-bar','table'];
  return [];
}

function getSelectedChartType(idx){
  var f=FIGS[idx];
  var allowed=typeListUnique(getAllowedChartTypes(f));
  if(!allowed.length)return inferDefaultChartType(f);
  var saved=chartTypeOverride[f.id];
  if(allowed.indexOf(saved)!==-1)return saved;
  var inferred=inferDefaultChartType(f);
  return allowed.indexOf(inferred)!==-1?inferred:allowed[0];
}

function normalizeLineThickness(v){
  var n=parseFloat(v);
  if(isNaN(n))n=2;
  n=Math.max(1,Math.min(8,n));
  return Math.round(n*2)/2;
}

function getLineThickness(idx){
  var f=FIGS[idx];
  var saved=lineThicknessOverride[f.id];
  return normalizeLineThickness(saved!==undefined?saved:(f.lineWidth||2));
}

function supportsLineThickness(type,f){
  var renderable=getRenderableChartType(type);
  return renderable==='line'||renderable==='multiple-lines'||renderable==='area'||renderable==='stacked-area'||renderable==='pareto'||renderable==='stock'||(renderable==='scatter'&&!!f.trend);
}

function getColor(cs,keys,def){
  for(var i=0;i<keys.length;i++){
    if(cs[keys[i]])return cs[keys[i]];
  }
  return def;
}

var CHART_PALETTE=['#8B2635','#1B2A4A','#3B7A57','#A2672D','#6E5F8F','#287C8E','#9A7D1F','#5E6472','#B24C63','#4E6E58','#7B4B94','#C17C74'];

function paletteColor(i){
  return CHART_PALETTE[i%CHART_PALETTE.length];
}

function withAlpha(hex,alpha){
  var s=String(hex||'#000000').replace('#','');
  if(s.length===3)s=s.split('').map(function(ch){return ch+ch;}).join('');
  var n=parseInt(s,16);
  if(isNaN(n))return 'rgba(0,0,0,'+alpha+')';
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+alpha+')';
}

function allDatasetValues(datasets){
  var values=[];
  (datasets||[]).forEach(function(d){
    (d.data||[]).forEach(function(v){
      if(typeof v==='number'&&isFinite(v))values.push(v);
    });
  });
  return values;
}

function quantile(sorted,q){
  if(!sorted.length)return 0;
  var pos=(sorted.length-1)*q;
  var base=Math.floor(pos);
  var rest=pos-base;
  if(sorted[base+1]!==undefined)return sorted[base]+rest*(sorted[base+1]-sorted[base]);
  return sorted[base];
}

function typeListUnique(types){
  var seen={};
  return (types||[]).filter(function(type){
    if(!type||seen[type])return false;
    seen[type]=true;
    return true;
  });
}

function getColorControlDefs(f,type){
  if(!f)return [];
  var renderable=getRenderableChartType(type||inferDefaultChartType(f));
  if(renderable==='choropleth-map'||renderable==='excel-map'){
    return [
      {key:'low',label:'Low',def:getFallbackColor(f,['low','bar'],'#dbeafe')},
      {key:'high',label:'High',def:getFallbackColor(f,['high','bar'],'#8B2635')},
      {key:'outline',label:'Outline',def:getFallbackColor(f,['outline','accent'],'#ffffff')}
    ];
  }
  if(['grouped-column','grouped-bar','stacked-column','stacked-column-100','stacked-bar','stacked-bar-100','split-bar','multiple-lines','stacked-area','stacked-area-100','combo','radar','multiple-pies','multiple-donuts'].indexOf(renderable)!==-1){
    var series=getMultiSeries(f);
    return series.datasets.map(function(d,i){
      return {key:d.label,label:d.label,def:paletteColor(i)};
    });
  }
  if(['pie','donut','election-donut','treemap','sunburst','funnel'].indexOf(renderable)!==-1){
    var part=getPartWholeSeries(f);
    return part.labels.map(function(label,i){
      return {key:'slice_'+i,label:String(label).slice(0,22),def:paletteColor(i)};
    });
  }
  if(renderable==='line')return [
    {key:'line',label:'Line',def:getFallbackColor(f,['line','bar'],'#8B2635')},
    {key:'point',label:'Dot',def:getFallbackColor(f,['point','dots'],'#1B2A4A')}
  ];
  if(renderable==='area')return [
    {key:'area',label:'Area',def:withAlphaHex(getFallbackColor(f,['line','bar'],'#8B2635'),0.45)},
    {key:'line',label:'Line',def:getFallbackColor(f,['line','bar'],'#8B2635')},
    {key:'point',label:'Dot',def:getFallbackColor(f,['point','dots'],'#1B2A4A')}
  ];
  if(renderable==='scatter')return [
    {key:'dots',label:'Dots',def:getFallbackColor(f,['dots','point','bar'],'#8B2635')},
    {key:'trend',label:'Trend',def:getFallbackColor(f,['trend','line'],'#1B2A4A')}
  ];
  if(renderable==='bubble')return [
    {key:'bubbleFill',label:'Bubble Fill',def:getFallbackColor(f,['bubble','dots','bar'],'#8B2635')},
    {key:'bubbleBorder',label:'Bubble Border',def:getFallbackColor(f,['bubbleBorder','bubble','dots'],'#8B2635')}
  ];
  if(renderable==='dot')return [
    {key:'dot',label:'Dot',def:getFallbackColor(f,['dot','bar','point'],'#8B2635')}
  ];
  if(renderable==='range'||renderable==='arrow')return [
    {key:'rangeFill',label:renderable==='arrow'?'Arrow Fill':'Range Fill',def:getFallbackColor(f,['rangeFill','range','bar'],'#8B2635')},
    {key:'rangeBorder',label:renderable==='arrow'?'Arrow Line':'Range Line',def:getFallbackColor(f,['rangeBorder','range','bar'],'#8B2635')}
  ];
  if(renderable==='bullet-bar')return [
    {key:'bar',label:'Actual',def:getFallbackColor(f,['bar','line'],'#8B2635')},
    {key:'target',label:'Target',def:getFallbackColor(f,['target','rangeBorder'],'#1B2A4A')},
    {key:'band',label:'Band',def:getFallbackColor(f,['band'],'#E5E7EB')}
  ];
  if(['symbol-map','locator-map','surface','table'].indexOf(renderable)!==-1)return [
    {key:'bar',label:renderable==='surface'?'Heat':'Value',def:getFallbackColor(f,['bar','bubbleFill','dots'],'#8B2635')},
    {key:'accent',label:'Accent',def:getFallbackColor(f,['accent','line','trend'],'#1B2A4A')}
  ];
  if(renderable==='pareto')return [
    {key:'bar',label:'Bar',def:getFallbackColor(f,['bar'],'#8B2635')},
    {key:'line',label:'Cumulative',def:getFallbackColor(f,['line','trend'],'#1B2A4A')},
    {key:'point',label:'Dot',def:getFallbackColor(f,['point','line'],'#1B2A4A')}
  ];
  if(renderable==='waterfall')return [
    {key:'positive',label:'Positive',def:getFallbackColor(f,['positive'],'#3B7A57')},
    {key:'negative',label:'Negative',def:getFallbackColor(f,['negative','bar'],'#8B2635')},
    {key:'total',label:'Total',def:getFallbackColor(f,['total'],'#1B2A4A')}
  ];
  if(renderable==='stock')return [
    {key:'range',label:'High-Low',def:getFallbackColor(f,['range'],'#5E6472')},
    {key:'line',label:'Close',def:getFallbackColor(f,['line'],'#8B2635')},

  ];
  if(renderable==='box-whisker')return [
    {key:'boxFill',label:'Box Fill',def:getFallbackColor(f,['boxFill','bar'],'#8B2635')},
    {key:'boxBorder',label:'Box Line',def:getFallbackColor(f,['boxBorder','bar'],'#8B2635')},

  ];

}

function getFallbackColor(f,keys,def){
  var defs=(f&&f.colors)||[];
  for(var i=0;i<keys.length;i++){
    var found=defs.find(function(c){return c.key===keys[i];});
    if(found)return found.def;
  }
  return def;
}

function withAlphaHex(hex,amount){
  var s=String(hex||'#000000').replace('#','');
  if(s.length===3)s=s.split('').map(function(ch){return ch+ch;}).join('');
  var n=parseInt(s,16);
  if(isNaN(n))return hex||'#000000';
  var mix=function(c){return Math.round(c+(255-c)*(1-amount));};
  var r=mix((n>>16)&255),g=mix((n>>8)&255),b=mix(n&255);
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

function ensureColorDefaults(idx,type){
  var f=FIGS[idx];
  if(!f)return [];
  if(!colorState[idx])colorState[idx]={};
  var defs=getColorControlDefs(f,type);
  defs.forEach(function(c){
    if(!colorState[idx][c.key])colorState[idx][c.key]=c.def;
  });
  return defs;
}

function formatValue(f,v){
  if(f.fmt)return f.fmt(v);
  if(typeof v==='number')return defaultNumberFormat(v);
  return v;
}

function getCategorySeries(f){
  if(f&&!f.uploaded)repairBuiltInChartData(f);
  if(hasCategorySeries(f))return {labels:f.labels.slice(),data:f.data.slice()};
  if(f&&Array.isArray(f.labels)&&Array.isArray(f.data)){
    var n=Math.min(f.labels.length,f.data.length);
    var labels=f.labels.slice(0,n);
    var data=f.data.slice(0,n);
    if(n>0&&!labelsAreBlank(labels)&&data.some(isFiniteNumberValue)){
      return {labels:labels,data:data};
    }
  }
  if(f&&!f.uploaded){
    var base=BUILTIN_BY_ID[f.builtInId||f.id];
    if(hasUsableCategorySeries(base)){
      f.labels=base.labels.slice();
      f.data=base.data.slice();
      return {labels:f.labels.slice(),data:f.data.slice()};
    }
  }
  if(hasScatterSeries(f)){
    var pts=f.points.slice().sort(function(a,b){return a.x-b.x});
    return {
      labels:pts.map(function(p){return Number(p.x).toFixed(1)}),
      data:pts.map(function(p){return p.y})
    };
  }
  return {labels:[],data:[]};
}

function getMultiSeries(f){
  if(Array.isArray(f.datasets)&&Array.isArray(f.labels)){
    return {labels:f.labels,datasets:f.datasets.map(function(d){return {label:d.label,data:d.data.slice()};})};
  }
  if(hasCategorySeries(f)){
    return {labels:f.labels,datasets:[{label:f.yLabel||f.xLabel||f.title||'Value',data:f.data.slice()}]};
  }
  return {labels:[],datasets:[]};
}

function getPartWholeSeries(f){
  var series=getCategorySeries(f);
  var labels=[],data=[];
  series.labels.forEach(function(label,i){
    var value=series.data[i];
    if(typeof value==='number'&&isFinite(value)&&value>0){
      labels.push(label);
      data.push(value);
    }
  });
  return {labels:labels,data:data};
}

function getRangeSeries(f){
  if(Array.isArray(f.rangeData))return f.rangeData;
  if(Array.isArray(f.points)){
    return f.points.map(function(p,i){return {label:p.label||String(i+1),start:p.x,end:p.y};});
  }
  return [];
}

function getBubbleSeries(f){
  if(Array.isArray(f.bubbles))return f.bubbles;
  if(Array.isArray(f.points))return f.points.map(function(p){return {x:p.x,y:p.y,r:5,label:p.label||''};});
  return [];
}

function autoAxisMax(data){
  var nums=data.filter(function(v){return typeof v==='number'&&isFinite(v)});
  if(!nums.length)return undefined;
  var max=Math.max.apply(null,nums);
  if(max<=0)return undefined;
  if(max<=10)return Math.ceil(max);
  if(max<=100)return Math.ceil(max/10)*10;
  if(max<=1000)return Math.ceil(max/100)*100;
  return Math.ceil(max/1000)*1000;
}

function getValueAxisMax(f,data){
  return f.yMax||f.xMax||autoAxisMax(data);
}

function mergeFormatDefaults(saved){
  var base=getFormatDefaults();
  saved=saved||{};
  ['x','y'].forEach(function(axis){
    Object.assign(base.axes[axis],(saved.axes&&saved.axes[axis])||{});
  });
  Object.assign(base.labels,saved.labels||{});
  Object.assign(base.legend,saved.legend||{});
  Object.assign(base.chart,saved.chart||{});
  Object.assign(base.table,saved.table||{});
  return base;

function getChartFormat(idx){
  var f=FIGS[idx];
  if(!f)return getFormatDefaults();

function setChartFormatPatch(section,patch){
  var f=FIGS[currentIdx];
  if(!f)return;
  var current=mergeFormatDefaults(chartFormatOverride[f.id]);
  if(section==='axes'){
    current.axes[patch.axis]=Object.assign({},current.axes[patch.axis],patch.values||{});
  } else {
    current[section]=Object.assign({},current[section],patch||{});
  }
  chartFormatOverride[f.id]=current;
  queueSave();

function resetFormat(){
  var f=FIGS[currentIdx];
  if(!f)return;
  delete chartFormatOverride[f.id];

  updateChart();

function swapAxisFormat(){
  var f=FIGS[currentIdx];
  if(!f)return;
  var type=getSelectedChartType(currentIdx);
  if(!chartHasAxes(type))return;
  var current=mergeFormatDefaults(chartFormatOverride[f.id]);
  var x=Object.assign({},current.axes.x);
  current.axes.x=Object.assign({},current.axes.y);
  current.axes.y=x;
  chartFormatOverride[f.id]=current;
  queueSave();
  syncFormatPanel();
  updateChart();
}

function parseOptionalNumber(v){
  if(v===''||v==null)return undefined;
  var n=parseFloat(v);
  return isFinite(n)?n:undefined;
}

function getAxisFormat(f,axisKey){
  var idx=FIGS.indexOf(f);
  var fmt=getChartFormat(idx>=0?idx:currentIdx);
  return fmt.axes[axisKey]||getFormatDefaults().axes[axisKey];
}

function hasExplicitNumberFormat(opts){
  opts=opts||{};
  return opts.decimals!==''&&opts.decimals!=null||opts.prefix||opts.suffix;
}

function formatNumberCore(v,decimals){
  var n=Number(v);
  if(!isFinite(n))return v;
  if(decimals!==''&&decimals!=null&&!isNaN(parseInt(decimals,10))){
    var d=Math.max(0,Math.min(6,parseInt(decimals,10)));
    return n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
  }
  return defaultNumberFormat(n);
}

function formatPercentValue(v,decimals){
  var d=decimals!==''&&decimals!=null&&!isNaN(parseInt(decimals,10))?Math.max(0,Math.min(6,parseInt(decimals,10))):0;
  return Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
}

function formatChartValue(f,value,formatOptions){
  formatOptions=formatOptions||{};
  if(typeof value==='number'&&isFinite(value)){
    var body=hasExplicitNumberFormat(formatOptions)
      ?formatNumberCore(value,formatOptions.decimals)
      :(f&&f.fmt?f.fmt(value):defaultNumberFormat(value));
    return (formatOptions.prefix||'')+body+(formatOptions.suffix||'');
  }
  return value;
}

function axisTitleFor(f,axisKey,fallback){
  var af=getAxisFormat(f,axisKey);
  if(af.title!==''&&af.title!=null)return af.title;
  return fallback||'';
}

function makeNumericScale(f,axisKey,defaults){
  defaults=defaults||{};
  var af=getAxisFormat(f,axisKey);
  var min=parseOptionalNumber(af.min);
  var max=parseOptionalNumber(af.max);
  var step=parseOptionalNumber(af.step);
  var title=axisTitleFor(f,axisKey,defaults.title);
  var scale={
    stacked:defaults.stacked,
    beginAtZero:defaults.beginAtZero!==undefined?defaults.beginAtZero:true,
    min:min!==undefined?min:defaults.min,
    max:max!==undefined?max:defaults.max,
    suggestedMin:defaults.suggestedMin,
    suggestedMax:defaults.suggestedMax,
    position:defaults.position,
    grid:{display:af.grid!==false,color:defaults.gridColor||'#eee',drawOnChartArea:defaults.drawOnChartArea},
    ticks:{
      font:{size:defaults.tickSize||11},
      color:defaults.tickColor||'#888',
      stepSize:step!==undefined?step:defaults.stepSize,
      includeBounds:defaults.includeBounds,
      callback:function(v){return formatChartValue(f,v,af);}
    },
    title:title?{display:true,text:title,font:{size:defaults.titleSize||11},color:'#666',padding:defaults.titlePadding||{top:6,bottom:6}}:{display:false},
    border:{display:defaults.borderDisplay!==undefined?defaults.borderDisplay:false,color:defaults.borderColor||'#d1d5db'}
  };
  if(defaults.type)scale.type=defaults.type;
  return scale;
}

function makePercentScale(f,axisKey,defaults){
  var scale=makeNumericScale(f,axisKey,defaults);
  if(!hasExplicitNumberFormat(getAxisFormat(f,axisKey))){
    scale.ticks.callback=function(v){return formatPercentValue(v,'');};
  }
  return scale;
}

function makeCategoryTickCallback(labels,customCallback){
  return function(value,index,ticks){
    if(customCallback)return customCallback.call(this,value,index,ticks);
    if(this&&this.getLabelForValue){
      var mapped=this.getLabelForValue(value);
      if(mapped!==value&&mapped!=null)return mapped;
    }
    var n=typeof value==='number'?value:parseInt(value,10);
    if(Array.isArray(labels)&&isFinite(n)&&n>=0&&n<labels.length){
      return labels[n];
    }
    if(Array.isArray(labels)&&labels[index]!=null){
      return labels[index];
    }
    return value;
  };
}

function makeCategoryScale(f,axisKey,defaults){
  defaults=defaults||{};
  var af=getAxisFormat(f,axisKey);
  var title=axisTitleFor(f,axisKey,defaults.title);
  var labels=defaults.labels||(Array.isArray(f.labels)?f.labels:null);
  var tickCallback=defaults.type==='linear'?defaults.callback:makeCategoryTickCallback(labels,defaults.callback);
  var scale={
    stacked:defaults.stacked,
    type:defaults.type||'category',
    min:defaults.min,
    max:defaults.max,
    reverse:defaults.reverse,
    grid:{display:af.grid!==false&&defaults.gridDisplay!==false,color:defaults.gridColor||'#eee'},
    ticks:{
      font:{size:defaults.tickSize||12,weight:defaults.weight||'500'},
      color:defaults.tickColor||'#1B2A4A',
      stepSize:defaults.stepSize,
      autoSkip:defaults.autoSkip!==undefined?defaults.autoSkip:(axisKey==='x'&&Array.isArray(labels)&&labels.length>30),
      autoSkipPadding:8,
      maxRotation:defaults.maxRotation!==undefined?defaults.maxRotation:(axisKey==='x'?45:0),
      minRotation:defaults.minRotation!==undefined?defaults.minRotation:0,
      callback:tickCallback
    },
    title:title?{display:true,text:title,font:{size:11},color:'#666',padding:{top:6,bottom:6}}:{display:false},
    border:{display:defaults.borderDisplay!==undefined?defaults.borderDisplay:true,color:defaults.borderColor||'#d1d5db'}
  };
  return scale;
}

function labelFormatterFor(f,context){
  var labelFmt=getChartFormat(currentIdx).labels;
  return function(v,c){
    if(context&&context.formatter)return context.formatter(v,c,labelFmt);
    var raw=context&&context.value?context.value(v,c):v;
    if(labelFmt.showPercent&&context&&context.total){
      return formatPercentValue(Number(raw)/context.total*100,labelFmt.decimals);
    }
    if(labelFmt.showPercent&&context&&context.percentValue){
      return formatPercentValue(raw,labelFmt.decimals);
    }
    return formatChartValue(f,raw,labelFmt);
  };
}

function labelPositionDefaults(position,defaults){
  defaults=defaults||{};
  if(position==='center'||position==='inside')return {anchor:'center',align:'center'};
  if(position==='outside'||position==='end')return {anchor:'end',align:defaults.outsideAlign||defaults.align||'top'};
  return {anchor:defaults.anchor||'end',align:defaults.align||'top'};
}

function buildDatalabelOptions(f,lbl,context){
  context=context||{};
  var labelFmt=getChartFormat(currentIdx).labels;
  var pos=labelPositionDefaults(labelFmt.position,context);
  var bs=boxedStyle(lbl,context.color||'#1B2A4A');
  var display=context.display!==undefined?context.display:lbl.show;
  var userSize=parseFloat(labelFmt.fontSize);
  var size=isFinite(userSize)?Math.max(7,Math.min(28,userSize)):(context.fontSize||10);
  return {
    display:display,
    anchor:pos.anchor,
    align:pos.align,
    offset:context.offset!==undefined?context.offset:5,
    color:context.forceColor||bs.color,
    backgroundColor:context.forceBackground!==undefined?context.forceBackground:bs.backgroundColor,
    borderColor:bs.borderColor,
    borderWidth:bs.borderWidth,
    borderRadius:bs.borderRadius,
    padding:bs.padding,
    font:{size:size,weight:'600'},
    formatter:labelFormatterFor(f,context)
  };
}

function chartHasAxes(type){
  var renderable=getRenderableChartType(type);
  return ['pie','donut','election-donut','treemap','sunburst','funnel','table','choropleth-map','symbol-map','locator-map','excel-map','surface'].indexOf(renderable)===-1;
}

function numericAxesForType(type){
  var renderable=getRenderableChartType(type);
  if(renderable==='scatter'||renderable==='bubble')return {x:true,y:true};
  if(['bar','dot','range','arrow','bullet-bar'].indexOf(renderable)!==-1)return {x:true,y:false};
  if(!chartHasAxes(renderable))return {x:false,y:false};
  return {x:false,y:true};
}

function toggleFormatPanel(){
  formatPanelOpen=!formatPanelOpen;
  syncFormatPanel();
}

function syncFormatPanel(){
  var panel=document.getElementById('formatPanel');
  var btn=document.getElementById('formatToggleBtn');
  if(btn)btn.classList.toggle('active',formatPanelOpen);
  if(!panel)return;
  var f=FIGS[currentIdx];
  if(!formatPanelOpen||!f){
    panel.classList.add('hidden');
    panel.innerHTML='';
    return;
  }
  var type=getSelectedChartType(currentIdx);
  var fmt=getChartFormat(currentIdx);
  var axes=numericAxesForType(type);
  panel.classList.remove('hidden');
  panel.innerHTML=
    '<div class="format-panel-head"><div><div class="format-panel-title">Format Chart</div><div class="format-panel-note">'+(chartHasAxes(type)?'Axes, labels, and legend settings are saved per chart.':'This chart type has no axes.')+'</div></div>'+
    '<div class="format-actions">'+(chartHasAxes(type)?'<button class="format-btn" onclick="swapAxisFormat()">Swap X/Y</button>':'')+'<button class="format-btn" onclick="resetFormat()">Reset Format</button><button class="format-btn" onclick="toggleFormatPanel()">Close</button></div></div>'+
    '<div class="format-grid">'+
      (chartHasAxes(type)?renderAxisFormatSection('x',fmt.axes.x,axes.x,f.xLabel||'')+renderAxisFormatSection('y',fmt.axes.y,axes.y,f.yLabel||''):'')+
      renderChartSpecificFormatSection(fmt.chart,type)+
      (getRenderableChartType(type)==='table'?renderTableFormatSection(fmt.table):'')+
      renderLabelFormatSection(fmt.labels,type)+renderLegendFormatSection(fmt.legend)+
    '</div>';
}

function renderAxisFormatSection(axis,fmt,isNumeric,defaultTitle){
  return '<div class="format-section"><div class="format-section-title">'+axis.toUpperCase()+' Axis</div>'+
    '<div class="format-row"><label>Title</label><input value="'+escapeHTML(fmt.title||'')+'" placeholder="'+escapeHTML(defaultTitle||'')+'" onchange="setAxisFormat(&quot;'+axis+'&quot;,&quot;title&quot;,this.value)"></div>'+
    (isNumeric?'<div class="format-row"><label>Range</label><div class="format-row-inline"><input placeholder="Min" value="'+escapeHTML(fmt.min)+'" onchange="setAxisFormat(&quot;'+axis+'&quot;,&quot;min&quot;,this.value)"><input placeholder="Max" value="'+escapeHTML(fmt.max)+'" onchange="setAxisFormat(&quot;'+axis+'&quot;,&quot;max&quot;,this.value)"><input placeholder="Step" value="'+escapeHTML(fmt.step)+'" onchange="setAxisFormat(&quot;'+axis+'&quot;,&quot;step&quot;,this.value)"></div></div>'+
    '<div class="format-row"><label>Number</label><div class="format-row-inline"><input placeholder="Prefix" value="'+escapeHTML(fmt.prefix)+'" onchange="setAxisFormat(&quot;'+axis+'&quot;,&quot;prefix&quot;,this.value)"><input placeholder="Suffix" value="'+escapeHTML(fmt.suffix)+'" onchange="setAxisFormat(&quot;'+axis+'&quot;,&quot;suffix&quot;,this.value)"><input placeholder="Decimals" value="'+escapeHTML(fmt.decimals)+'" onchange="setAxisFormat(&quot;'+axis+'&quot;,&quot;decimals&quot;,this.value)"></div></div>':'')+
    '<div class="format-row"><label>Gridlines</label><input type="checkbox" '+(fmt.grid!==false?'checked':'')+' onchange="setAxisFormat(&quot;'+axis+'&quot;,&quot;grid&quot;,this.checked)"></div>'+
    '</div>';
}

function renderLabelFormatSection(fmt,type){
  var renderable=getRenderableChartType(type);
  var supportsPercent=['pie','donut','stacked-bar-100','stacked-column-100','stacked-area-100'].indexOf(type)!==-1||
    ['pie','donut','stacked-bar-100','stacked-column-100','stacked-area-100'].indexOf(renderable)!==-1;
  return '<div class="format-section"><div class="format-section-title">Data Labels</div>'+
    '<div class="format-row"><label>Position</label><select onchange="setLabelFormat(&quot;position&quot;,this.value)">'+['auto','end','center','inside','outside'].map(function(v){return '<option value="'+v+'" '+(fmt.position===v?'selected':'')+'>'+v+'</option>';}).join('')+'</select></div>'+
    '<div class="format-row"><label>Size</label><div class="format-row-inline"><input type="range" min="7" max="28" step="1" value="'+escapeHTML(fmt.fontSize)+'" oninput="setLabelSize(this.value)"><input type="number" min="7" max="28" step="1" value="'+escapeHTML(fmt.fontSize)+'" onchange="setLabelSize(this.value)"><span class="size-unit">px</span></div></div>'+
    '<div class="format-row"><label>Number</label><div class="format-row-inline"><input placeholder="Prefix" value="'+escapeHTML(fmt.prefix)+'" onchange="setLabelFormat(&quot;prefix&quot;,this.value)"><input placeholder="Suffix" value="'+escapeHTML(fmt.suffix)+'" onchange="setLabelFormat(&quot;suffix&quot;,this.value)"><input placeholder="Decimals" value="'+escapeHTML(fmt.decimals)+'" onchange="setLabelFormat(&quot;decimals&quot;,this.value)"></div></div>'+
    '<div class="format-row"><label>Percent</label><input type="checkbox" '+(fmt.showPercent?'checked':'')+' '+(supportsPercent?'':'disabled')+' onchange="setLabelFormat(&quot;showPercent&quot;,this.checked)"></div>'+
    '</div>';
}

function renderLegendFormatSection(fmt){
  return '<div class="format-section"><div class="format-section-title">Legend</div>'+
    '<div class="format-row"><label>Show</label><input type="checkbox" '+(fmt.show!==false?'checked':'')+' onchange="setLegendFormat(&quot;show&quot;,this.checked)"></div>'+
    '<div class="format-row"><label>Position</label><select onchange="setLegendFormat(&quot;position&quot;,this.value)">'+['top','bottom','right'].map(function(v){return '<option value="'+v+'" '+(fmt.position===v?'selected':'')+'>'+v+'</option>';}).join('')+'</select></div>'+
    '</div>';
}

function renderChartSpecificFormatSection(fmt,type){
  var renderable=getRenderableChartType(type);
  if(renderable==='pie'||renderable==='donut'||renderable==='election-donut'){
    var cutout=renderable==='pie'?fmt.pieCutout:fmt.donutCutout;
    return '<div class="format-section"><div class="format-section-title">'+(renderable==='pie'?'Pie':'Donut')+'</div>'+
      '<div class="format-row"><label>Inner</label><div class="format-row-inline"><input type="range" min="0" max="85" step="1" value="'+escapeHTML(cutout)+'" oninput="setChartSpecificFormat(&quot;'+(renderable==='pie'?'pieCutout':'donutCutout')+'&quot;,this.value)"><input type="number" min="0" max="85" step="1" value="'+escapeHTML(cutout)+'" onchange="setChartSpecificFormat(&quot;'+(renderable==='pie'?'pieCutout':'donutCutout')+'&quot;,this.value)"><span class="size-unit">%</span></div></div>'+
      '<div class="format-row"><label>Border</label><input type="number" min="0" max="8" step="1" value="'+escapeHTML(fmt.sliceBorder)+'" onchange="setChartSpecificFormat(&quot;sliceBorder&quot;,this.value)"></div>'+
      '</div>';
  }
  if(renderable==='funnel'){
    return '<div class="format-section"><div class="format-section-title">Funnel</div>'+
      '<div class="format-row"><label>Neck</label><div class="format-row-inline"><input type="range" min="10" max="95" step="1" value="'+escapeHTML(fmt.funnelNeck)+'" oninput="setChartSpecificFormat(&quot;funnelNeck&quot;,this.value)"><input type="number" min="10" max="95" step="1" value="'+escapeHTML(fmt.funnelNeck)+'" onchange="setChartSpecificFormat(&quot;funnelNeck&quot;,this.value)"><span class="size-unit">%</span></div></div>'+
      '</div>';
  }
  if(renderable==='bubble'||renderable==='symbol-map'||renderable==='locator-map'){
    return '<div class="format-section"><div class="format-section-title">Bubbles</div>'+
      '<div class="format-row"><label>Scale</label><div class="format-row-inline"><input type="range" min="0.5" max="2.5" step="0.1" value="'+escapeHTML(fmt.bubbleScale)+'" oninput="setChartSpecificFormat(&quot;bubbleScale&quot;,this.value)"><input type="number" min="0.5" max="2.5" step="0.1" value="'+escapeHTML(fmt.bubbleScale)+'" onchange="setChartSpecificFormat(&quot;bubbleScale&quot;,this.value)"><span class="size-unit">x</span></div></div>'+
      '</div>';
  }
  if(renderable==='histogram'){
    return '<div class="format-section"><div class="format-section-title">Histogram</div>'+
      '<div class="format-row"><label>Bins</label><input type="number" min="2" max="30" step="1" placeholder="Auto" value="'+escapeHTML(fmt.histogramBins)+'" onchange="setChartSpecificFormat(&quot;histogramBins&quot;,this.value)"></div>'+
      '</div>';
  }
  if(renderable==='radar'){
    return '<div class="format-section"><div class="format-section-title">Radar</div>'+
      '<div class="format-row"><label>Fill</label><div class="format-row-inline"><input type="range" min="0" max="0.7" step="0.05" value="'+escapeHTML(fmt.radarFill)+'" oninput="setChartSpecificFormat(&quot;radarFill&quot;,this.value)"><input type="number" min="0" max="0.7" step="0.05" value="'+escapeHTML(fmt.radarFill)+'" onchange="setChartSpecificFormat(&quot;radarFill&quot;,this.value)"><span class="size-unit">op</span></div></div>'+
      '</div>';
  }
  return '';
}

function renderTableFormatSection(fmt){
  return '<div class="format-section"><div class="format-section-title">Table</div>'+
    '<div class="format-row"><label>Header</label><div class="format-row-inline"><input type="color" title="Header fill" value="'+escapeHTML(fmt.headerBg)+'" onchange="setTableFormat(&quot;headerBg&quot;,this.value)"><input type="color" title="Header text" value="'+escapeHTML(fmt.headerText)+'" onchange="setTableFormat(&quot;headerText&quot;,this.value)"><input placeholder="Font" value="'+escapeHTML(fmt.fontSize)+'" onchange="setTableFormat(&quot;fontSize&quot;,this.value)"></div></div>'+
    '<div class="format-row"><label>Rows</label><div class="format-row-inline"><input type="color" title="Body text" value="'+escapeHTML(fmt.bodyText)+'" onchange="setTableFormat(&quot;bodyText&quot;,this.value)"><input type="color" title="Row fill" value="'+escapeHTML(fmt.rowBg)+'" onchange="setTableFormat(&quot;rowBg&quot;,this.value)"><input type="color" title="Stripe fill" value="'+escapeHTML(fmt.stripeBg)+'" onchange="setTableFormat(&quot;stripeBg&quot;,this.value)"></div></div>'+
    '<div class="format-row"><label>Border</label><input type="color" value="'+escapeHTML(fmt.border)+'" onchange="setTableFormat(&quot;border&quot;,this.value)"></div>'+
    '</div>';
