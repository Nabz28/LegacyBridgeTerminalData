function setAxisFormat(axis,key,value){
  var values={};
  values[key]=value;
  setChartFormatPatch('axes',{axis:axis,values:values});
}

function setLabelFormat(key,value){
  var patch={};
  patch[key]=value;
  setChartFormatPatch('labels',patch);
}

function setLabelSize(value){
  var n=parseFloat(value);
  if(!isFinite(n))n=10;
  n=Math.max(7,Math.min(28,n));
  setLabelFormat('fontSize',String(Math.round(n)));
}

function setLegendFormat(key,value){
  var patch={};
  patch[key]=value;
  setChartFormatPatch('legend',patch);
}

function setChartSpecificFormat(key,value){
  var patch={};
  var n=parseFloat(value);
  if(['pieCutout','donutCutout'].indexOf(key)!==-1)patch[key]=String(isFinite(n)?Math.max(0,Math.min(85,n)):50);
  else if(key==='sliceBorder')patch[key]=String(isFinite(n)?Math.max(0,Math.min(8,n)):2);
  else if(key==='funnelNeck')patch[key]=String(isFinite(n)?Math.max(10,Math.min(95,n)):45);
  else if(key==='bubbleScale')patch[key]=String(isFinite(n)?Math.max(0.5,Math.min(2.5,n)):1);
  else if(key==='histogramBins')patch[key]=value===''?'':String(isFinite(n)?Math.max(2,Math.min(30,Math.round(n))):'');
  else if(key==='radarFill')patch[key]=String(isFinite(n)?Math.max(0,Math.min(0.7,n)):0.18);
  else patch[key]=value;
  setChartFormatPatch('chart',patch);
}

function setTableFormat(key,value){
  var patch={};
  if(key==='fontSize'){
    var n=parseFloat(value);
    patch[key]=isFinite(n)?String(Math.max(8,Math.min(24,n))):'11';
  } else {
    patch[key]=value;
  }
  setChartFormatPatch('table',patch);
}

function syncChartTypeControls(){
  var group=document.getElementById('chartTypeGroup');
  var select=document.getElementById('chartTypeSelect');
  if(!group||!select)return;
  var f=FIGS[currentIdx];
  if(!f){
    group.classList.add('hidden');
    select.innerHTML='';
    return;
  }
  var allowed=typeListUnique(getAllowedChartTypes(f));
  if(!allowed.length){
    group.classList.add('hidden');
    select.innerHTML='';
    return;
  }
  group.classList.remove('hidden');
  select.innerHTML='';
  allowed.forEach(function(type){
    var def=getChartTypeDef(type);
    var opt=document.createElement('option');
    opt.value=type;
    opt.textContent=(def?def.label:type)+(isTypeImplemented(type)?'':(' (uses '+(TYPE_LABELS[def&&def.fallbackType]||def&&def.fallbackType||'fallback')+')'));
    opt.disabled=false;
    opt.title=def&&!isTypeImplemented(type)?('Pending renderer; uses '+(TYPE_LABELS[def.fallbackType]||def.fallbackType)+' fallback'):'';
    select.appendChild(opt);
  });
  select.value=getSelectedChartType(currentIdx);
}

function syncLineThicknessControls(){
  var group=document.getElementById('lineThicknessGroup');
  var range=document.getElementById('lineThicknessRange');
  var input=document.getElementById('lineThicknessInput');
  if(!group||!range||!input)return;
  var f=FIGS[currentIdx];
  if(!f){
    group.classList.add('hidden');
    return;
  }
  var type=getSelectedChartType(currentIdx);
  if(!supportsLineThickness(type,f)){
    group.classList.add('hidden');
    return;
  }
  var thickness=getLineThickness(currentIdx);
  group.classList.remove('hidden');
  range.value=thickness;
  input.value=thickness;
}

function onChartTypeChange(){
  var f=FIGS[currentIdx];
  if(!f)return;
  var select=document.getElementById('chartTypeSelect');
  var allowed=typeListUnique(getAllowedChartTypes(f));
  if(!select||allowed.indexOf(select.value)===-1)return;
  chartTypeOverride[f.id]=select.value;
  syncLineThicknessControls();
  syncDotsControl();
  buildColorControls();
  syncFormatPanel();
  queueSave();
  updateChart();
}

function onLineThicknessInput(value){
  var f=FIGS[currentIdx];
  if(!f)return;
  var thickness=normalizeLineThickness(value);
  lineThicknessOverride[f.id]=thickness;
  var range=document.getElementById('lineThicknessRange');
  var input=document.getElementById('lineThicknessInput');
  if(range)range.value=thickness;
  if(input)input.value=thickness;
  queueSave();
  updateChart();
}

function escapeHTML(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function baseFileName(name){
  return String(name||'Uploaded data').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim()||'Uploaded data';
}

function makeUploadedId(title){
  var slug=String(title||'upload').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,32)||'upload';
  var id='upload_'+slug;
  var n=1,existing={};
  FIGS.forEach(function(f){existing[f.id]=true;});
  while(existing[id]){n++;id='upload_'+slug+'_'+n;}
  return id;
}

function defaultNumberFormat(v){
  if(typeof v!=='number'||!isFinite(v))return v;
  if(Math.abs(v)>=1000)return v.toLocaleString(undefined,{maximumFractionDigits:1});
  if(Math.abs(v)>=10)return Number.isInteger(v)?String(v):v.toFixed(1);
  return Number.isInteger(v)?String(v):v.toFixed(2);
}

function renderProjectSelect(){
  var select=document.getElementById('projectSelect');
  if(!select)return;
  select.innerHTML='';
  projects.forEach(function(project){
    var opt=document.createElement('option');
    opt.value=project.id;
    opt.textContent=project.name;
    select.appendChild(opt);
  });
  select.value=activeProjectId||'';
  var editBtn=document.getElementById('editModeBtn');
  if(editBtn){
    editBtn.classList.toggle('active',editMode);
    editBtn.textContent=editMode?'Done':'Edit';
  }
}

function onProjectSelectChange(){
  var select=document.getElementById('projectSelect');
  if(!select||select.value===activeProjectId)return;
  persistActiveProjectSettings();
  activeProjectId=select.value;
  applyProject(getActiveProject());
  renderProjectSelect();
  renderSidebar();
  queueSave();
  if(FIGS.length)showChart(0);else showChart(-1);
}

function newProject(){
  var name=prompt('Project name','Untitled Project');
  if(name===null)return;
  persistActiveProjectSettings();
  var project=createEmptyProject(name.trim()||'Untitled Project');
  projects.push(project);
  activeProjectId=project.id;
  applyProject(project);
  renderProjectSelect();
  renderSidebar();
  queueSave();
  showChart(-1);
}

function renameProject(){
  var project=getActiveProject();
  if(!project)return;
  var name=prompt('Rename project',project.name);
  if(name===null)return;
  project.name=name.trim()||project.name;
  renderProjectSelect();
  queueSave();
}

function saveProjectFile(){
  persistActiveProjectSettings();
  var project=getActiveProject();
  if(!project)return;
  var blob=new Blob([JSON.stringify(serializeProject(project),null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=project.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')+'.autocharter.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function loadProjectFile(){
  var input=document.getElementById('projectFileInput');
  if(!input)return;
  input.value='';
  input.click();
}

function onProjectFileSelected(event){
  var file=event&&event.target&&event.target.files&&event.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var parsed=JSON.parse(String(e.target.result||'{}'));
      var project=parsed.projects?hydrateProject(parsed.projects[0]):hydrateProject(parsed);
      project.id=makeId('project',project.name);
      projects.push(project);
      persistActiveProjectSettings();
      activeProjectId=project.id;
      applyProject(project);
      renderProjectSelect();
      renderSidebar();
      queueSave();
      if(FIGS.length)showChart(0);else showChart(-1);
    }catch(err){
      showImportMessage('Could not load project',err.message||String(err),true);
    }
  };
  reader.readAsText(file);
}

function toggleEditMode(){
  editMode=!editMode;
  renderProjectSelect();
  renderSidebar();
}

function addCategory(){
  var project=getActiveProject();
  if(!project)return;
  var name=prompt('New category name','New Category');
  if(name===null)return;
  project.categories.push({id:makeId('cat',name),name:name.trim()||'New Category'});
  editMode=true;
  renderProjectSelect();
  renderSidebar();
  queueSave();
}

function renameCategory(catId){
  var project=getActiveProject();
  var cat=project&&project.categories.find(function(c){return c.id===catId;});
  if(!cat)return;
  var name=prompt('Rename category',cat.name);
  if(name===null)return;
  cat.name=name.trim()||cat.name;
  renderSidebar();
  queueSave();
}

function deleteCategory(catId){
  var project=getActiveProject();
  if(!project||catId==='cat_uncategorized')return;
  var cat=project.categories.find(function(c){return c.id===catId;});
  if(!cat)return;
  if(!confirm('Delete category "'+cat.name+'"? Charts inside it will move to Uncategorized.'))return;
  project.charts.forEach(function(f){if(f.categoryId===catId)f.categoryId='cat_uncategorized';});
  project.categories=project.categories.filter(function(c){return c.id!==catId;});
  normalizeProject(project);
  renderSidebar();
  queueSave();
}

function assignChartCategory(chartId,catId){
  var project=getActiveProject();
  var chart=project&&project.charts.find(function(f){return f.id===chartId;});
  if(!chart)return;
  chart.categoryId=catId;
  renderSidebar();
  queueSave();
}

function showChartById(chartId){
  var idx=FIGS.findIndex(function(f){return f.id===chartId;});
  showChart(idx);
}

function renderSidebar(){
  var project=getActiveProject();
  var container=document.getElementById('sidebarCharts');
  if(!container||!project)return;
  normalizeProject(project);
  container.innerHTML='';
  project.categories.forEach(function(cat){
    var charts=project.charts.filter(function(f){return f.categoryId===cat.id;});
    if(!charts.length&&!editMode)return;
    var block=document.createElement('div');
    block.className='category-block';
    block.dataset.catId=cat.id;
    block.ondragover=function(e){e.preventDefault();block.classList.add('drag-over');};
    block.ondragleave=function(){block.classList.remove('drag-over');};
    block.ondrop=function(e){onCategoryDrop(e,cat.id);block.classList.remove('drag-over');};
    var header=document.createElement('div');
    header.className='sb-section category-header';
    header.draggable=editMode;
    header.ondragstart=function(e){onCategoryDragStart(e,cat.id);};
    header.ondrop=function(e){onCategoryDrop(e,cat.id);};
    if(editMode){
      var handle=document.createElement('span');
      handle.className='drag-handle';
      handle.textContent='::';
      header.appendChild(handle);
    }
    var title=document.createElement('span');
    title.className='category-title';
    title.textContent=cat.name;
    header.appendChild(title);
    if(editMode){
      var ren=document.createElement('button');
      ren.className='edit-chip';
      ren.textContent='Rename';
      ren.onclick=function(e){e.stopPropagation();renameCategory(cat.id);};
      header.appendChild(ren);
      var del=document.createElement('button');
      del.className='edit-chip';
      del.textContent='Delete';
      del.onclick=function(e){e.stopPropagation();deleteCategory(cat.id);};
      header.appendChild(del);
    }
    block.appendChild(header);
    if(!charts.length&&editMode){
      var empty=document.createElement('div');
      empty.className='empty-category';
      empty.textContent='Drop charts here';
      block.appendChild(empty);
    }
    charts.forEach(function(f){
      var item=document.createElement('div');
      item.className='chart-item';
      item.dataset.chartId=f.id;
      item.draggable=editMode;
      item.ondragstart=function(e){onChartDragStart(e,f.id);};
      item.ondragover=function(e){e.preventDefault();item.classList.add('drag-over');};
      item.ondragleave=function(){item.classList.remove('drag-over');};
      item.ondrop=function(e){onChartDrop(e,f.id);item.classList.remove('drag-over');};
      var btn=document.createElement('button');
      btn.className='fig-btn'+(FIGS[currentIdx]&&FIGS[currentIdx].id===f.id?' active':'');
      btn.dataset.chartId=f.id;
      btn.onclick=function(){showChartById(f.id);};
      var num=document.createElement('span');
      num.className='fig-num';
      num.textContent=f.figureLabel||'Chart';
      btn.appendChild(num);
      btn.appendChild(document.createTextNode(f.title));
      item.appendChild(btn);
      if(editMode){
        var editRow=document.createElement('div');
        editRow.className='chart-edit-row';
        var handle=document.createElement('span');
        handle.className='drag-handle';
        handle.textContent='::';
        editRow.appendChild(handle);
        var sel=document.createElement('select');
        project.categories.forEach(function(c){
          var opt=document.createElement('option');
          opt.value=c.id;
          opt.textContent=c.name;
          sel.appendChild(opt);
        });
        sel.value=f.categoryId;
        sel.onchange=function(e){assignChartCategory(f.id,e.target.value);};
        editRow.appendChild(sel);
        item.appendChild(editRow);
      }
      block.appendChild(item);
    });
    container.appendChild(block);
  });
}

function onCategoryDragStart(e,catId){
  if(!editMode)return;
  dragState={type:'category',catId:catId};
  if(e.dataTransfer)e.dataTransfer.setData('text/plain','category:'+catId);
}

function onChartDragStart(e,chartId){
  if(!editMode)return;
  dragState={type:'chart',chartId:chartId};
  if(e.dataTransfer)e.dataTransfer.setData('text/plain','chart:'+chartId);
}

function onCategoryDrop(e,catId){
  if(e)e.preventDefault();
  var project=getActiveProject();
  if(!project||!dragState)return;
  if(dragState.type==='category'&&dragState.catId!==catId){
    var from=project.categories.findIndex(function(c){return c.id===dragState.catId;});
    var to=project.categories.findIndex(function(c){return c.id===catId;});
    if(from>=0&&to>=0){
      var moved=project.categories.splice(from,1)[0];
      project.categories.splice(to,0,moved);
    }
  }
  if(dragState.type==='chart'){
    var chart=project.charts.find(function(f){return f.id===dragState.chartId;});
    if(chart)chart.categoryId=catId;
  }
  dragState=null;
  renderSidebar();
  queueSave();
}

function onChartDrop(e,targetChartId){
  if(e)e.preventDefault();
  var project=getActiveProject();
  if(!project||!dragState||dragState.type!=='chart'||dragState.chartId===targetChartId)return;
  var from=project.charts.findIndex(function(f){return f.id===dragState.chartId;});
  var to=project.charts.findIndex(function(f){return f.id===targetChartId;});
  if(from>=0&&to>=0){
    var moved=project.charts.splice(from,1)[0];
    var target=project.charts[to>from?to-1:to];
    moved.categoryId=target.categoryId;
    var insertAt=project.charts.findIndex(function(f){return f.id===targetChartId;});
    project.charts.splice(insertAt,0,moved);
  }
  dragState=null;
  renderSidebar();
  queueSave();
}

function openDataUpload(){
  var input=document.getElementById('dataFileInput');
  if(!input)return;
  input.value='';
  input.click();
}

function onDataFileSelected(event){
  var file=event&&event.target&&event.target.files&&event.target.files[0];
  if(!file)return;
  var name=file.name||'uploaded-data';
  var lower=name.toLowerCase();
  if(/\.(xlsx|xls)$/.test(lower)){
    if(typeof XLSX==='undefined'){
      showImportMessage('Excel support unavailable','The XLSX parser did not load. Export the spreadsheet as CSV or reconnect to the internet and reload.',true);
      return;
    }
    var readerX=new FileReader();
    readerX.onload=function(e){
      try{handleWorkbook(e.target.result,name);}
      catch(err){showImportMessage('Could not read workbook',err.message||String(err),true);}
    };
    readerX.readAsArrayBuffer(file);
    return;
  }
  var reader=new FileReader();
  reader.onload=function(e){
    try{processImportedRows(parseCSV(String(e.target.result||'')),name,{});}
    catch(err){showImportMessage('Could not read CSV',err.message||String(err),true);}
  };
  reader.readAsText(file);
}

function handleWorkbook(buffer,fileName){
  var wb=XLSX.read(buffer,{type:'array'});
  var sheets=[];
  wb.SheetNames.forEach(function(name){
    var sheet=wb.Sheets[name];
    var rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:''});
    var nonEmpty=rows.some(function(row){return row.some(function(c){return String(c).trim()!=='';});});
    if(nonEmpty)sheets.push({name:name,rows:rows});
  });
  if(!sheets.length){
    showImportMessage('No usable sheet found','The workbook has no non-empty sheets.',true);
    return;
  }
  workbookSheetDraft={fileName:fileName,sheets:sheets};
  processImportedRows(sheets[0].rows,fileName,{sheetName:sheets[0].name,sheetIndex:0,sheetCount:sheets.length});
}

function parseCSV(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  var delimiter=detectDelimiter(text);
  return parseDelimited(text,delimiter);
}

function detectDelimiter(text){
  var candidates=[',',';','\t','|'];
  var lines=String(text||'').split(/\r?\n/).filter(function(line){return line.trim()!=='';}).slice(0,20);
  var best=',',bestScore=-Infinity;
  candidates.forEach(function(delim){
    var counts=lines.map(function(line){return parseDelimitedLine(line,delim).length;}).filter(function(n){return n>1;});
    if(!counts.length)return;
    var avg=counts.reduce(function(a,b){return a+b;},0)/counts.length;
    var spread=Math.max.apply(null,counts)-Math.min.apply(null,counts);
    var score=avg*2-spread;
    if(score>bestScore){bestScore=score;best=delim;}
  });
  return best;
}

function parseDelimitedLine(line,delimiter){
  var rows=parseDelimited(String(line||''),delimiter);
  return rows[0]||[];
}

function parseDelimited(text,delimiter){
  var rows=[],row=[],cell='',inQuotes=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i],next=text[i+1];
    if(ch==='"'){
      if(inQuotes&&next==='"'){cell+='"';i++;}
      else inQuotes=!inQuotes;
    } else if(ch===delimiter&&!inQuotes){
      row.push(cell);cell='';
    } else if((ch==='\n'||ch==='\r')&&!inQuotes){
      if(ch==='\r'&&next==='\n')i++;
      row.push(cell);rows.push(row);row=[];cell='';
    } else {
      cell+=ch;
    }
  }
  row.push(cell);rows.push(row);
  return rows;
}

function normalizeImportedRows(rawRows){
  var stats={blankRows:0,trimmedCells:0,numericConversions:0,droppedRows:0,repeatedHeaders:0};
  var rows=[];
  rawRows.forEach(function(rawRow,rowIdx){
    var row=(rawRow||[]).map(function(cell,colIdx){
      var original=cell==null?'':String(cell);
      if(rowIdx===0&&colIdx===0)original=original.replace(/^\uFEFF/,'');
      var trimmed=original.trim().replace(/\s+/g,' ');
      if(trimmed!==original)stats.trimmedCells++;
      return trimmed;
    });
    while(row.length&&row[row.length-1]==='')row.pop();
    if(row.every(function(c){return c==='';})){stats.blankRows++;return;}
    rows.push(row);
  });
  return {rows:rows,stats:stats};
}

function isYearLabel(v){
  return /^\d{4}[AEF]?$/.test(String(v||'').trim());
}

function isTimeCategoryLabel(v){
  var s=String(v||'').trim();
  return isYearLabel(s)||
    /^(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)([a-z]+)?[\s-]*\d{0,4}$/i.test(s)||
    /^q[1-4][\s-]*\d{0,4}$/i.test(s)||
    /^\d{4}[-\/]\d{1,2}([-/]\d{1,2})?$/.test(s)||
    /^\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}$/.test(s);
}

function headerSuggestsPartWhole(name){
  return /\b(share|mix|portion|composition|distribution|split|percent|percentage|pct|weight)\b/i.test(String(name||''));
}

function valuesLookPercentLike(values){
  var total=(values||[]).reduce(function(sum,v){return sum+(typeof v==='number'&&isFinite(v)?v:0);},0);
  return total>=95&&total<=105;
}

function headerLooksSeriesLike(name){
  var s=String(name||'').trim();
  return isTimeCategoryLabel(s)||/\b(actual|forecast|plan|budget|target|prior|current|fy\d{2,4})\b/i.test(s);
}

function parseNumberCell(value){
  if(typeof value==='number'&&isFinite(value))return {ok:true,value:value,changed:false};
  var s=String(value==null?'':value).trim();
  if(!s)return {ok:false};
  var original=s,negative=false;
  if(/^\(.*\)$/.test(s)){negative=true;s=s.slice(1,-1);}
  s=s.replace(/[%]/g,'');
  s=s.replace(/\b(usd|idr|rp|juta|million|millions|m|bn|billion)\b/ig,'');
  s=s.replace(/[$€£¥]/g,'');
  s=s.replace(/\s+/g,'');
  if(/^-?\d{1,3}(\.\d{3})+,\d+$/.test(s)){
    s=s.replace(/\./g,'').replace(',','.');
  } else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)){
    s=s.replace(/,/g,'');
  } else if(/^-?\d+,\d+$/.test(s)&&s.indexOf('.')===-1){
    s=s.replace(',','.');
  }
  s=s.replace(/,/g,'');
  if(!/^-?\d*\.?\d+$/.test(s))return {ok:false};
  var n=parseFloat(s);
  if(!isFinite(n))return {ok:false};
  if(negative)n=-Math.abs(n);
  return {ok:true,value:n,changed:original!==String(n)};
}

function cleanHeader(v,i){
  var s=String(v||'').trim().replace(/\s+/g,' ');
  s=s.replace(/\s*\[[^\]]+\]\s*$/,'').replace(/\s*\*+\s*$/,'');
  return s||('Column '+(i+1));
}

function dedupeHeaders(row){
  var seen={};
  return row.map(function(v,i){
    var h=cleanHeader(v,i),base=h,n=1;
    while(seen[h]){n++;h=base+' '+n;}
    seen[h]=true;
    return h;
  });
}

function isRepeatedHeader(row,headers){
  var vals=headers.map(function(h,i){return String(row[i]||'').trim().toLowerCase();});
  return vals.filter(Boolean).length>=2&&vals.every(function(v,i){return !v||v===String(headers[i]).trim().toLowerCase();});
}

function prepareTable(rows,stats){
  var headerIdx=0;
  for(var i=0;i<rows.length;i++){
    if(rows[i].filter(Boolean).length>=2){headerIdx=i;break;}
  }
  var maxLen=rows.reduce(function(m,row){return Math.max(m,row.length);},0);
  var headerRow=(rows[headerIdx]||[]).slice();
  while(headerRow.length<maxLen)headerRow.push('');
  var headers=dedupeHeaders(headerRow);
  var dataRows=[];
  rows.slice(headerIdx+1).forEach(function(row){
    if(isRepeatedHeader(row,headers)){stats.repeatedHeaders++;return;}
    dataRows.push(row);
  });
  return {headers:headers,rows:dataRows,stats:stats};
}

function detectWideTimeSeries(rows,stats,fileName,meta){
  for(var i=0;i<rows.length;i++){
    var yearCols=[];
    rows[i].forEach(function(cell,idx){if(isYearLabel(cell))yearCols.push(idx);});
    if(yearCols.length<2)continue;
    for(var r=i+1;r<rows.length;r++){
      var numericCount=0;
      yearCols.forEach(function(col){if(parseNumberCell(rows[r][col]).ok)numericCount++;});
      if(numericCount<2)continue;
      var labels=[],data=[],dropped=0;
      yearCols.forEach(function(col){
        var parsed=parseNumberCell(rows[r][col]);
        if(parsed.ok){
          labels.push(rows[i][col]);
          data.push(parsed.value);
          if(parsed.changed)stats.numericConversions++;
        } else dropped++;
      });
      stats.droppedRows+=dropped;
      var seriesName='';
      for(var c=0;c<yearCols[0];c++){
        if(rows[r][c]){seriesName=rows[r][c];break;}
      }
      seriesName=seriesName||baseFileName(fileName);
      return {
        confidence:'high',
        summary:{chartType:'line',columns:'wide year headers',warnings:[],stats:stats},
        fig:makeUploadedFig({
          title:seriesName,
          fileName:fileName,
          sheetName:meta.sheetName,
          chartType:'line',
          labels:labels,
          data:data,
          yLabel:'Value',
          allowedTypes:['column','line']
        })
      };
    }
  }
  return null;
}

function profileColumns(table){
  return table.headers.map(function(h,col){
    var numeric=0,text=0,year=0,nonEmpty=0;
    table.rows.forEach(function(row){
      var v=row[col];
      if(v==null||String(v).trim()==='')return;
      nonEmpty++;
      if(isYearLabel(v))year++;
      if(parseNumberCell(v).ok)numeric++;
      else text++;
    });
    return {index:col,name:h,numeric:numeric,text:text,year:year,nonEmpty:nonEmpty};
  });
}

function headerIndex(headers,patterns){
  var lower=headers.map(function(h){return String(h||'').toLowerCase();});
  for(var i=0;i<patterns.length;i++){
    var re=patterns[i];
    for(var j=0;j<lower.length;j++){
      if(re.test(lower[j]))return j;
    }
  }
  return -1;
}

function isGeoHeader(name){
  return /\b(country|province|state|county|city|postal|postcode|zip|location|geo|geography|kecamatan|kabupaten|provinsi|nation|territory)\b/i.test(String(name||''));
}

function detectGeoCandidate(table,numericCols,fileName,meta){
  var geoCol=-1;
  table.headers.forEach(function(h,i){if(geoCol<0&&isGeoHeader(h))geoCol=i;});
  if(geoCol<0||!numericCols.length)return null;
  return buildFigFromColumns(table,{
    chartType:'bar',
    intendedType:'choropleth-map',
    labelCol:geoCol,
    valueCol:numericCols[0].index,
    dataShape:'geoSeries'
  },fileName,meta,'high',['Detected geographic data; map boundaries will be resolved automatically when possible.']);
}

function detectOHLC(table,numericCols,fileName,meta){
  var open=headerIndex(table.headers,[/\bopen\b/]);
  var high=headerIndex(table.headers,[/\bhigh\b/]);
  var low=headerIndex(table.headers,[/\blow\b/]);
  var close=headerIndex(table.headers,[/\bclose\b/,/\blast\b/]);
  if(open<0||high<0||low<0||close<0)return null;
  var labelCol=headerIndex(table.headers,[/\bdate\b/,/\btime\b/,/\byear\b/,/\bperiod\b/]);
  if(labelCol<0){
    var profiles=profileColumns(table);
    var text=profiles.filter(function(p){return p.index!==open&&p.index!==high&&p.index!==low&&p.index!==close&&p.nonEmpty>0&&p.numeric<p.nonEmpty;})[0];
    labelCol=text?text.index:0;
  }
  var ohlc=[];
  table.rows.forEach(function(row){
    var o=parseNumberCell(row[open]),h=parseNumberCell(row[high]),l=parseNumberCell(row[low]),c=parseNumberCell(row[close]);
    if(row[labelCol]&&o.ok&&h.ok&&l.ok&&c.ok)ohlc.push({label:String(row[labelCol]).trim(),open:o.value,high:h.value,low:l.value,close:c.value});
  });
  if(ohlc.length<2)return null;
  var fig=makeUploadedFig({
    title:'Stock / OHLC',
    fileName:fileName,
    sheetName:meta.sheetName,
    chartType:'stock',
    ohlc:ohlc,
    labels:ohlc.map(function(r){return r.label;}),
    data:ohlc.map(function(r){return r.close;}),
    yLabel:'Price',
    allowedTypes:['stock','line','column']
  });
  return {confidence:'high',summary:{chartType:'stock',columns:'open / high / low / close',warnings:[],stats:table.stats},fig:fig};
}

function detectLongTable(table,fileName,meta){
  var stats=table.stats;
  var profiles=profileColumns(table);
  var rowMin=Math.max(2,Math.ceil(table.rows.length*0.5));
  var numericCols=profiles.filter(function(p){return p.numeric>=rowMin;});
  var yearCols=profiles.filter(function(p){return p.year>=rowMin;});
  var textCols=profiles.filter(function(p){return p.text>=Math.max(1,Math.ceil(table.rows.length*0.35));});
  var ohlc=detectOHLC(table,numericCols,fileName,meta);
  if(ohlc)return ohlc;
  var geo=detectGeoCandidate(table,numericCols,fileName,meta);
  if(geo)return geo;
  if(textCols.length&&numericCols.length>=2){
    var startCol=headerIndex(table.headers,[/\bstart\b/,/\bbegin\b/,/\bfrom\b/,/\bmin\b/]);
    var endCol=headerIndex(table.headers,[/\bend\b/,/\bto\b/,/\bmax\b/,/\bfinish\b/]);
    if(startCol>=0&&endCol>=0){
      return buildFigFromColumns(table,{chartType:'range',labelCol:textCols[0].index,startCol:startCol,endCol:endCol},fileName,meta,'high',[]);
    }
  }
  var numericHeaders=numericCols.map(function(p){return table.headers[p.index];});
  var seriesLikeNumericHeaders=numericHeaders.some(headerLooksSeriesLike);
  if(numericCols.length>=3&&!textCols.length){
    return buildFigFromColumns(table,{chartType:'bubble',xCol:numericCols[0].index,yCol:numericCols[1].index,sizeCol:numericCols[2].index},fileName,meta,'high',[]);
  }
  if(numericCols.length===3&&textCols.length<=1&&!seriesLikeNumericHeaders){
    return buildFigFromColumns(table,{chartType:'bubble',xCol:numericCols[0].index,yCol:numericCols[1].index,sizeCol:numericCols[2].index,labelCol:textCols[0]?textCols[0].index:null},fileName,meta,'high',[]);
  }
  if(numericCols.length===2&&textCols.length<=1&&!seriesLikeNumericHeaders){
    return buildFigFromColumns(table,{chartType:'scatter',xCol:numericCols[0].index,yCol:numericCols[1].index,labelCol:textCols[0]?textCols[0].index:null},fileName,meta,'high',[]);
  }
  if(textCols.length&&numericCols.length>=2){
    return buildFigFromColumns(table,{chartType:'grouped-column',labelCol:textCols[0].index,valueCols:numericCols.map(function(p){return p.index;})},fileName,meta,'high',['Detected multiple numeric series.']);
  }
  if(yearCols.length&&numericCols.length){
    var yearCol=yearCols[0].index;
    var valueCol=numericCols.filter(function(p){return p.index!==yearCol;})[0];
    if(valueCol)return buildFigFromColumns(table,{chartType:'line',labelCol:yearCol,valueCol:valueCol.index},fileName,meta,'high',[]);
  }
  if(textCols.length&&numericCols.length===1){
    var labels=collectColumnValues(table,textCols[0].index);
    var values=table.rows.map(function(row){return parseNumberCell(row[numericCols[0].index]).value;}).filter(function(v){return typeof v==='number'&&isFinite(v);});
    var positive=values.length&&values.every(function(v){return v>0;});
    var timeLike=labels.length>1&&labels.every(isTimeCategoryLabel);
    var partWholeLike=headerSuggestsPartWhole(table.headers[numericCols[0].index])||headerSuggestsPartWhole(table.headers[textCols[0].index])||valuesLookPercentLike(values);
    if(positive&&values.length<=8&&partWholeLike){
      return buildFigFromColumns(table,{chartType:'pie',labelCol:textCols[0].index,valueCol:numericCols[0].index,dataShape:'partWholeSeries'},fileName,meta,'high',['Detected positive part-to-whole data.']);
    }
    var defaultType=timeLike?'line':(labels.length>6||labels.some(function(v){return String(v).length>12;})?'bar':'column');
    return buildFigFromColumns(table,{chartType:defaultType,labelCol:textCols[0].index,valueCol:numericCols[0].index},fileName,meta,'high',[]);
  }
  if(numericCols.length===2&&!textCols.length){
    return buildFigFromColumns(table,{chartType:'scatter',xCol:numericCols[0].index,yCol:numericCols[1].index},fileName,meta,'high',[]);
  }
  return {confidence:'low',table:table,fileName:fileName,meta:meta,reason:'The detector found several plausible column mappings.'};
}

function collectColumnValues(table,col){
  return table.rows.map(function(row){return row[col];}).filter(function(v){return v!=null&&String(v).trim()!=='';});
}

function buildFigFromColumns(table,map,fileName,meta,confidence,warnings){
  var stats=table.stats;
  warnings=warnings||[];
  if(map.chartType==='scatter'){
    var points=[];
    table.rows.forEach(function(row){
      var x=parseNumberCell(row[map.xCol]),y=parseNumberCell(row[map.yCol]);
      if(x.ok&&y.ok){
        points.push({x:x.value,y:y.value,label:map.labelCol!=null?String(row[map.labelCol]||'').trim():''});
        if(x.changed)stats.numericConversions++;
        if(y.changed)stats.numericConversions++;
      } else stats.droppedRows++;
    });
    if(points.length<2)return {confidence:'low',table:table,fileName:fileName,meta:meta,reason:'Not enough numeric x/y rows were found.'};
    var fig=makeUploadedFig({
      title:table.headers[map.yCol]+' vs '+table.headers[map.xCol],
      fileName:fileName,
      sheetName:meta.sheetName,
      chartType:'scatter',
      points:points,
      xLabel:table.headers[map.xCol],
      yLabel:table.headers[map.yCol],
      dataShape:'xySeries',
      allowedTypes:['scatter','line']
    });
    fig.trend=computeTrend(points);
    return {confidence:confidence,summary:{chartType:'scatter',columns:table.headers[map.xCol]+' / '+table.headers[map.yCol],warnings:warnings,stats:stats},fig:fig};
  }
  if(map.chartType==='bubble'){
    var rawBubbles=[],sizes=[];
    table.rows.forEach(function(row){
      var x=parseNumberCell(row[map.xCol]),y=parseNumberCell(row[map.yCol]),size=parseNumberCell(row[map.sizeCol]);
      if(x.ok&&y.ok&&size.ok){
        rawBubbles.push({x:x.value,y:y.value,size:Math.abs(size.value),label:map.labelCol!=null?String(row[map.labelCol]||'').trim():''});
        sizes.push(Math.abs(size.value));
        if(x.changed)stats.numericConversions++;
        if(y.changed)stats.numericConversions++;
        if(size.changed)stats.numericConversions++;
      } else stats.droppedRows++;
    });
    if(rawBubbles.length<2)return {confidence:'low',table:table,fileName:fileName,meta:meta,reason:'Not enough numeric x/y/size rows were found.'};
    var minSize=Math.min.apply(null,sizes),maxSize=Math.max.apply(null,sizes);
    var bubbles=rawBubbles.map(function(p){
      var r=maxSize===minSize?8:4+((p.size-minSize)/(maxSize-minSize))*14;
      return {x:p.x,y:p.y,r:r,size:p.size,label:p.label};
    });
    var bubbleFig=makeUploadedFig({
      title:table.headers[map.yCol]+' vs '+table.headers[map.xCol],
      fileName:fileName,
      sheetName:meta.sheetName,
      chartType:'bubble',
      bubbles:bubbles,
      points:bubbles.map(function(p){return {x:p.x,y:p.y,label:p.label};}),
      xLabel:table.headers[map.xCol],
      yLabel:table.headers[map.yCol],
      dataShape:'xyzSeries',
      allowedTypes:['bubble','scatter','surface']
    });
    bubbleFig.trend=computeTrend(bubbleFig.points);
    return {confidence:confidence,summary:{chartType:'bubble',columns:table.headers[map.xCol]+' / '+table.headers[map.yCol]+' / '+table.headers[map.sizeCol],warnings:warnings,stats:stats},fig:bubbleFig};
  }
  if(map.chartType==='range'||map.chartType==='arrow'){
    var rangeData=[],rangeLabels=[],rangeLengths=[];
    table.rows.forEach(function(row){
      var label=row[map.labelCol],start=parseNumberCell(row[map.startCol]),end=parseNumberCell(row[map.endCol]);
      if(label!=null&&String(label).trim()!==''&&start.ok&&end.ok){
        rangeData.push({label:String(label).trim(),start:start.value,end:end.value});
        rangeLabels.push(String(label).trim());
        rangeLengths.push(end.value-start.value);
        if(start.changed)stats.numericConversions++;
        if(end.changed)stats.numericConversions++;
      } else stats.droppedRows++;
    });
    if(rangeData.length<2)return {confidence:'low',table:table,fileName:fileName,meta:meta,reason:'Not enough label/start/end rows were found.'};
    return {
      confidence:confidence,
      summary:{chartType:map.chartType,columns:table.headers[map.labelCol]+' / '+table.headers[map.startCol]+' / '+table.headers[map.endCol],warnings:warnings,stats:stats},
      fig:makeUploadedFig({
        title:table.headers[map.startCol]+' to '+table.headers[map.endCol],
        fileName:fileName,
        sheetName:meta.sheetName,
        chartType:map.chartType,
        rangeData:rangeData,
        labels:rangeLabels,
        data:rangeLengths,
        xLabel:table.headers[map.startCol]+' to '+table.headers[map.endCol],
        dataShape:'rangeSeries',
        allowedTypes:['range','arrow','bar','column']
      })
    };
  }
  var multiTypes=['grouped-column','grouped-bar','stacked-column','stacked-column-100','stacked-bar','stacked-bar-100','split-bar','multiple-lines','stacked-area','stacked-area-100','combo','radar','multiple-pies','multiple-donuts','box-whisker'];
  if(multiTypes.indexOf(map.chartType)!==-1){
    var valueCols=(map.valueCols||[]).filter(function(col){return col!==map.labelCol;});
    if(!valueCols.length&&map.valueCol!=null)valueCols=[map.valueCol];
    var labels=[],datasets=valueCols.map(function(col){return {label:table.headers[col],data:[]};});
    table.rows.forEach(function(row){
      var label=row[map.labelCol],valid=0,values=[];
      valueCols.forEach(function(col){
        var parsed=parseNumberCell(row[col]);
        if(parsed.ok){
          valid++;
          values.push(parsed.value);
          if(parsed.changed)stats.numericConversions++;
        } else {
          values.push(null);
        }
      });
      if(label!=null&&String(label).trim()!==''&&valid){
        labels.push(String(label).trim());
        datasets.forEach(function(d,i){d.data.push(values[i]);});
      } else stats.droppedRows++;
    });
    if(labels.length<2||!datasets.length)return {confidence:'low',table:table,fileName:fileName,meta:meta,reason:'Not enough multi-series rows were found.'};
    return {
      confidence:confidence,
      summary:{chartType:map.chartType,columns:table.headers[map.labelCol]+' / '+valueCols.map(function(col){return table.headers[col];}).join(', '),warnings:warnings,stats:stats},
      fig:makeUploadedFig({
        title:baseFileName(fileName),
        fileName:fileName,
        sheetName:meta.sheetName,
        chartType:map.chartType,
        labels:labels,
        datasets:datasets,
        dataShape:'multiSeries',
        allowedTypes:['grouped-column','grouped-bar','stacked-column','stacked-column-100','stacked-bar','stacked-bar-100','split-bar','multiple-lines','stacked-area','stacked-area-100','combo','radar','multiple-pies','multiple-donuts','box-whisker','table']
      })
    };
  }
  var labels=[],data=[];
  table.rows.forEach(function(row){
    var label=row[map.labelCol],value=parseNumberCell(row[map.valueCol]);
    if(label!=null&&String(label).trim()!==''&&value.ok){
      labels.push(String(label).trim());
      data.push(value.value);
      if(value.changed)stats.numericConversions++;
    } else stats.droppedRows++;
  });
  if(data.length<2)return {confidence:'low',table:table,fileName:fileName,meta:meta,reason:'Not enough label/value rows were found.'};
  var figType=map.chartType==='line'?'line-simple':map.chartType==='column'?'vbar-simple':'hbar-simple';
  var categoryAllowed=map.allowedTypes||(
    map.dataShape==='geoSeries'
      ?typeListUnique([map.intendedType||'choropleth-map','choropleth-map','excel-map','symbol-map','locator-map','bar','column','table'])
      :map.dataShape==='partWholeSeries'||map.chartType==='pie'||map.chartType==='donut'
        ?['pie','donut','bar','column','treemap','sunburst']
        :['bar','column','line','area','dot','pie','donut','waterfall','histogram','pareto']
  );
  return {
    confidence:confidence,
    summary:{chartType:map.intendedType||map.chartType,columns:table.headers[map.labelCol]+' / '+table.headers[map.valueCol],warnings:warnings,stats:stats},
    fig:makeUploadedFig({
      title:table.headers[map.valueCol],
      fileName:fileName,
      sheetName:meta.sheetName,
      chartType:map.chartType,
      intendedType:map.intendedType,
      legacyType:figType,
      labels:labels,
      data:data,
      yLabel:table.headers[map.valueCol],
      xLabel:table.headers[map.valueCol],
      dataShape:map.dataShape||((map.chartType==='pie'||map.chartType==='donut')?'partWholeSeries':'categorySeries'),
      allowedTypes:categoryAllowed,
      geoLabelHeader:map.dataShape==='geoSeries'?table.headers[map.labelCol]:undefined,
      geoValueHeader:map.dataShape==='geoSeries'?table.headers[map.valueCol]:undefined
    })
  };
}

function makeUploadedFig(opts){
  var defaultType=opts.intendedType||opts.chartType;
  var renderable=getRenderableChartType(defaultType);
  var colors;
  if(renderable==='choropleth-map'||renderable==='excel-map'){
    colors=[
      {key:'low',label:'Low',def:'#dbeafe'},
      {key:'high',label:'High',def:'#8B2635'},
      {key:'outline',label:'Outline',def:'#ffffff'}
    ];
  } else
  if(Array.isArray(opts.datasets)){
    colors=opts.datasets.map(function(d,i){return {key:d.label,label:d.label,def:paletteColor(i)};});
  } else if(defaultType==='pie'||defaultType==='donut'||opts.dataShape==='partWholeSeries'){
    colors=(opts.labels||[]).slice(0,12).map(function(label,i){return {key:'slice_'+i,label:String(label).slice(0,22),def:paletteColor(i)};});
    if(!colors.length)colors=[{key:'bar',label:'Value',def:'#8B2635'}];
  } else if(renderable==='scatter'){
    colors=[{key:'dots',label:'Dots',def:'#8B2635'},{key:'trend',label:'Trend',def:'#1B2A4A'}];
  } else if(renderable==='bubble'){
    colors=[{key:'bubble',label:'Bubble',def:'#8B2635'},{key:'trend',label:'Trend',def:'#1B2A4A'}];
  } else if(['line','area','pareto','stock'].indexOf(renderable)!==-1){
    colors=[{key:'line',label:'Line',def:'#8B2635'},{key:'point',label:'Point',def:'#1B2A4A'}];
  } else if(['range','arrow'].indexOf(renderable)!==-1){
    colors=[{key:'range',label:'Range',def:'#8B2635'}];
  } else if(renderable==='waterfall'){
    colors=[{key:'positive',label:'Positive',def:'#3B7A57'},{key:'negative',label:'Negative',def:'#8B2635'},{key:'total',label:'Total',def:'#1B2A4A'}];
  } else {
    colors=[{key:'bar',label:'Bar',def:'#8B2635'}];
  }
  var legacyType=opts.legacyType||(
    renderable==='scatter'||renderable==='bubble'?'scatter':
    ['line','multiple-lines','area','stacked-area','pareto','stock'].indexOf(renderable)!==-1?'line-simple':
    ['column','grouped-column','stacked-column','stacked-column-100'].indexOf(renderable)!==-1?'vbar-simple':
    renderable==='stacked-bar-100'?'stacked100-hbar':'hbar-simple'
  );
  var fig={
    id:makeUploadedId(opts.title),
    uploaded:true,
    title:opts.title||baseFileName(opts.fileName),
    sub:'Imported from '+opts.fileName,
    type:legacyType,
    defaultType:defaultType,
    intendedType:opts.intendedType,
    dataShape:opts.dataShape||(getChartTypeDef(defaultType)||{}).dataShape||'categorySeries',
    allowedTypes:opts.allowedTypes||getAllowedChartTypes({labels:opts.labels,data:opts.data,points:opts.points,datasets:opts.datasets,bubbles:opts.bubbles,rangeData:opts.rangeData,ohlc:opts.ohlc,dataShape:opts.dataShape,intendedType:opts.intendedType}),
    colors:colors,
    labelsDefault:true,
    src:'Uploaded file: '+opts.fileName+(opts.sheetName?' / sheet: '+opts.sheetName:'')
  };
  if(opts.labels)fig.labels=opts.labels;
  if(opts.data)fig.data=opts.data;
  if(opts.points)fig.points=opts.points;
  if(opts.datasets)fig.datasets=opts.datasets;
  if(opts.bubbles)fig.bubbles=opts.bubbles;
  if(opts.rangeData)fig.rangeData=opts.rangeData;
  if(opts.ohlc)fig.ohlc=opts.ohlc;
  if(opts.geoLabelHeader)fig.geoLabelHeader=opts.geoLabelHeader;
  if(opts.geoValueHeader)fig.geoValueHeader=opts.geoValueHeader;
  if(opts.xLabel)fig.xLabel=opts.xLabel;
  if(opts.yLabel)fig.yLabel=opts.yLabel;
  if(opts.data)fig.yMax=autoAxisMax(opts.data);
  if(opts.datasets)fig.yMax=autoAxisMax(allDatasetValues(opts.datasets));
  if(opts.rangeData){
    var rangeValues=[];
    opts.rangeData.forEach(function(r){rangeValues.push(r.start,r.end);});
    fig.xMin=Math.min.apply(null,rangeValues);
    fig.xMax=Math.max.apply(null,rangeValues);
  }
  if(opts.points){
    fig.xMin=Math.min.apply(null,opts.points.map(function(p){return p.x;}));
    fig.xMax=Math.max.apply(null,opts.points.map(function(p){return p.x;}));
    fig.yMin=Math.min.apply(null,opts.points.map(function(p){return p.y;}));
    fig.yMax=Math.max.apply(null,opts.points.map(function(p){return p.y;}));
  }
  if(opts.bubbles){
    fig.xMin=Math.min.apply(null,opts.bubbles.map(function(p){return p.x;}));
    fig.xMax=Math.max.apply(null,opts.bubbles.map(function(p){return p.x;}));
    fig.yMin=Math.min.apply(null,opts.bubbles.map(function(p){return p.y;}));
    fig.yMax=Math.max.apply(null,opts.bubbles.map(function(p){return p.y;}));
  }
  return fig;
}

function computeTrend(points){
  if(!points||points.length<2)return null;
  var n=points.length,sx=0,sy=0,sxy=0,sx2=0;
  points.forEach(function(p){sx+=p.x;sy+=p.y;sxy+=p.x*p.y;sx2+=p.x*p.x;});
  var denom=n*sx2-sx*sx;
  if(Math.abs(denom)<1e-9)return null;
  var slope=(n*sxy-sx*sy)/denom;
  var intercept=(sy-slope*sx)/n;
  return {
    slope:slope,
    intercept:intercept,
    xStart:Math.min.apply(null,points.map(function(p){return p.x;})),
    xEnd:Math.max.apply(null,points.map(function(p){return p.x;}))
  };
}

function processImportedRows(rawRows,fileName,meta){
  var result=getImportedFigureResult(rawRows,fileName,meta||{});
  if(result.errorTitle){
    showImportMessage(result.errorTitle,result.errorMessage,true);
    return;
  }
  if(result.confidence==='high')addUploadedChart(result.fig,result.summary,meta);
  else showMapper(result.table,fileName,result.reason,meta||{});
}

function addUploadedChart(fig,summary,meta){
  persistActiveProjectSettings();
  var project=getActiveProject();
  if(!project){
    project=createEmptyProject('Untitled Project');
    projects.push(project);
    activeProjectId=project.id;
  }
  normalizeProject(project);
  fig.uploaded=true;
  fig.categoryId=(FIGS[currentIdx]&&FIGS[currentIdx].categoryId)||'cat_uncategorized';
  fig.figureLabel=fig.figureLabel||('Upload '+(project.charts.filter(function(f){return f.uploaded;}).length+1));
  project.charts.push(fig);
  applyProject(project);
  chartTypeOverride[fig.id]=fig.defaultType;
  queueSave();
  renderProjectSelect();
  renderSidebar();
  showChart(FIGS.findIndex(function(f){return f.id===fig.id;}));
  showImportSummary(fig,summary,meta);
}

      '</select></div>';
  }
  var warnings=(summary.warnings||[]).map(function(w){return '<div class="import-warning">'+escapeHTML(w)+'</div>';}).join('');
  var intended=fig.intendedType||summary.chartType;
  var renderable=getRenderableChartType(intended);
  var fallbackHTML=intended&&renderable&&intended!==renderable
    ?'<div class="import-warning">Detected '+escapeHTML(TYPE_LABELS[intended]||intended)+', using '+escapeHTML(TYPE_LABELS[renderable]||renderable)+' until that renderer is added.</div>'
    :'';
  panel.classList.remove('hidden');

    '<div>Detected <b>'+escapeHTML(summary.chartType)+'</b> chart from '+escapeHTML(summary.columns||'uploaded columns')+'.</div>'+
    '<div>Repairs: '+(stats.trimmedCells||0)+' trimmed cells, '+(stats.numericConversions||0)+' numeric conversions, '+(stats.blankRows||0)+' blank rows removed, '+(stats.repeatedHeaders||0)+' repeated headers removed, '+(stats.droppedRows||0)+' rows dropped.</div>'+
    warnings+fallbackHTML+sheetHTML+

function showMapper(table,fileName,reason,meta){
  uploadImportDraft={table:table,fileName:fileName,meta:meta||{}};
  var panel=document.getElementById('importPanel');
  if(!panel)return;
  var opts=table.headers.map(function(h,i){return '<option value="'+i+'">'+escapeHTML(h)+'</option>';}).join('');
  var mapperTypes=['bar','column','line','area','dot','pie','donut','election-donut','treemap','sunburst','funnel','waterfall','histogram','pareto','scatter','bubble','grouped-column','grouped-bar','stacked-column','stacked-column-100','stacked-bar','stacked-bar-100','split-bar','multiple-lines','stacked-area','stacked-area-100','combo','radar','multiple-pies','multiple-donuts','range','arrow','bullet-bar','box-whisker','choropleth-map','symbol-map','locator-map','excel-map','table','stock'];
  var typeOptions=mapperTypes.map(function(type){
    var def=getChartTypeDef(type);
    var disabled=type==='stock';
    var suffix=!disabled&&!isTypeImplemented(type)&&def&&def.fallbackType?' (uses '+(TYPE_LABELS[def.fallbackType]||def.fallbackType)+')':'';
    return '<option value="'+type+'" '+(disabled?'disabled':'')+'>'+escapeHTML((def?def.label:type)+suffix+(disabled?' (auto-detect only)':''))+'</option>';
  }).join('');
  var firstNumeric=profileColumns(table).filter(function(p){return p.numeric>0;})[0];
  var firstText=profileColumns(table).filter(function(p){return p.text>0||p.year>0;})[0];
  panel.classList.remove('hidden');
  panel.innerHTML='<div class="import-panel-title">Map columns to create chart</div>'+
    '<div class="import-warning">'+escapeHTML(reason||'Choose the columns to chart.')+'</div>'+
    '<div class="import-grid">'+
      '<div class="import-field"><label>Chart Type</label><select id="mapperChartType">'+typeOptions+'</select></div>'+
      '<div class="import-field"><label>Label / Year</label><select id="mapperLabelCol">'+opts+'</select></div>'+
      '<div class="import-field"><label>Value</label><select id="mapperValueCol">'+opts+'</select></div>'+
      '<div class="import-field"><label>X</label><select id="mapperXCol">'+opts+'</select></div>'+
      '<div class="import-field"><label>Y</label><select id="mapperYCol">'+opts+'</select></div>'+
      '<div class="import-field"><label>Size / End</label><select id="mapperSizeCol">'+opts+'</select></div>'+
    '</div>'+
    '<div class="import-panel-actions"><button class="import-action primary" onclick="createMappedChart()">Create Chart</button><button class="import-action" onclick="hideImportPanel()">Cancel</button></div>';
  if(firstText)document.getElementById('mapperLabelCol').value=firstText.index;
  if(firstNumeric){
    document.getElementById('mapperValueCol').value=firstNumeric.index;
    document.getElementById('mapperYCol').value=firstNumeric.index;
  }
  var numeric=profileColumns(table).filter(function(p){return p.numeric>0;});
  if(numeric[0])document.getElementById('mapperXCol').value=numeric[0].index;
  if(numeric[1])document.getElementById('mapperYCol').value=numeric[1].index;
  if(numeric[2])document.getElementById('mapperSizeCol').value=numeric[2].index;
  else if(numeric[1])document.getElementById('mapperSizeCol').value=numeric[1].index;
}

function createMappedChart(){
  if(!uploadImportDraft)return;
  var chartType=document.getElementById('mapperChartType').value;
  var map={chartType:chartType};
  var labelCol=parseInt(document.getElementById('mapperLabelCol').value,10);
  var valueCol=parseInt(document.getElementById('mapperValueCol').value,10);
  var xCol=parseInt(document.getElementById('mapperXCol').value,10);
  var yCol=parseInt(document.getElementById('mapperYCol').value,10);
  var sizeCol=parseInt(document.getElementById('mapperSizeCol').value,10);
  var multiTypes=['grouped-column','grouped-bar','stacked-column','stacked-column-100','stacked-bar','stacked-bar-100','split-bar','multiple-lines','stacked-area','stacked-area-100','combo','radar','multiple-pies','multiple-donuts','box-whisker'];
  if(chartType==='scatter'){
    map.xCol=parseInt(document.getElementById('mapperXCol').value,10);
    map.yCol=parseInt(document.getElementById('mapperYCol').value,10);
    map.labelCol=labelCol;
  } else if(chartType==='bubble'){
    map.xCol=xCol;
    map.yCol=yCol;
    map.sizeCol=sizeCol;
    map.labelCol=labelCol;
  } else if(chartType==='range'||chartType==='arrow'){
    map.labelCol=labelCol;
    map.startCol=xCol;
    map.endCol=sizeCol;
  } else if(multiTypes.indexOf(chartType)!==-1){
    var profiles=profileColumns(uploadImportDraft.table);
    map.labelCol=labelCol;
    map.valueCols=profiles.filter(function(p){return p.index!==labelCol&&p.numeric>0;}).map(function(p){return p.index;});
    if(map.valueCols.indexOf(valueCol)===-1)map.valueCols.unshift(valueCol);
  } else if(chartType==='choropleth-map'||chartType==='excel-map'||chartType==='symbol-map'||chartType==='locator-map'){
    map.chartType='bar';
    map.intendedType=chartType;
    map.dataShape='geoSeries';
    map.labelCol=labelCol;
    map.valueCol=valueCol;
  } else if(chartType==='pie'||chartType==='donut'){
    map.labelCol=labelCol;
    map.valueCol=valueCol;
    map.dataShape='partWholeSeries';
  } else {
    map.labelCol=labelCol;
    map.valueCol=valueCol;
  }
  var result=buildFigFromColumns(uploadImportDraft.table,map,uploadImportDraft.fileName,uploadImportDraft.meta,'manual',['Columns were selected manually.']);
  if(result.fig&&uploadImportDraft.mode==='editor-remap')applyRemappedChart(result.fig,result.summary);
  else if(result.fig)addUploadedChart(result.fig,result.summary,uploadImportDraft.meta);
  else showMapper(result.table||uploadImportDraft.table,uploadImportDraft.fileName,result.reason||'The selected columns did not produce enough valid rows.',uploadImportDraft.meta);
}

function getEditableShape(f){
  if(Array.isArray(f.ohlc))return 'ohlcSeries';
  if(Array.isArray(f.bubbles))return 'xyzSeries';
  if(Array.isArray(f.rangeData))return 'rangeSeries';
  if(Array.isArray(f.datasets))return 'multiSeries';
  if(Array.isArray(f.points))return 'xySeries';
  if(f.dataShape==='partWholeSeries')return 'partWholeSeries';
  return 'categorySeries';
}

function chartToEditableTable(f){
  var shape=getEditableShape(f);
  if(shape==='ohlcSeries'){
    return {shape:shape,headers:['label','open','high','low','close'],rows:(f.ohlc||[]).map(function(r){return [r.label,r.open,r.high,r.low,r.close].map(dataEditorCellValue);})};
  }
  if(shape==='xyzSeries'){
    return {shape:shape,headers:['x','y','size','label'],rows:(f.bubbles||[]).map(function(p){return [p.x,p.y,p.size||p.r,p.label||''].map(dataEditorCellValue);})};
  }
  if(shape==='rangeSeries'){
    return {shape:shape,headers:['label','start','end'],rows:(f.rangeData||[]).map(function(r){return [r.label,r.start,r.end].map(dataEditorCellValue);})};
  }
  if(shape==='multiSeries'){
    var headers=['label'].concat((f.datasets||[]).map(function(d){return d.label;}));
    var rows=(f.labels||[]).map(function(label,i){
      return [label].concat((f.datasets||[]).map(function(d){return d.data[i];})).map(dataEditorCellValue);
    });
    return {shape:shape,headers:headers,rows:rows};
  }
  if(shape==='xySeries'){
    return {shape:shape,headers:['x','y','label'],rows:(f.points||[]).map(function(p){return [p.x,p.y,p.label||''].map(dataEditorCellValue);})};
  }
  return {
    shape:shape,
    headers:['label','value'],
    rows:(f.labels||[]).map(function(label,i){return [label,(f.data||[])[i]].map(dataEditorCellValue);})
  };
}

function dataEditorCellValue(v){
  return v==null?'':String(v);
}

function dataEditorShapeLabel(shape){
  return {
    categorySeries:'Category / value',
    partWholeSeries:'Part-to-whole',
    multiSeries:'Multi-series',
    xySeries:'X / Y',
    xyzSeries:'Bubble',
    rangeSeries:'Range',
    ohlcSeries:'OHLC'
  }[shape]||shape;
}

function renderDataEditor(){
  var panel=document.getElementById('dataEditorPanel');
  if(!panel)return;
  if(!dataEditorOpen||!dataEditorDraft){
    panel.classList.add('hidden');
    panel.innerHTML='';
    return;
  }
  var f=FIGS[currentIdx];
  var validation=validateEditableTable(f,dataEditorDraft);
  var applyDisabled=validation.errors.length?' disabled':'';
  var headers=dataEditorDraft.headers||[];
  var rows=dataEditorDraft.rows||[];
  var headHTML=headers.map(function(h,i){
    return '<th><input class="data-editor-input data-editor-header-input" value="'+escapeHTML(h)+'" onchange="updateDataEditorHeader('+i+',this.value)"></th>';
  }).join('')+'<th class="data-editor-row-action"></th>';
  var bodyHTML=rows.map(function(row,r){
    while(row.length<headers.length)row.push('');
    var cells=headers.map(function(h,c){
      return '<td><input class="data-editor-input" value="'+escapeHTML(row[c])+'" onchange="updateDataEditorCell('+r+','+c+',this.value)"></td>';
    }).join('');
    return '<tr>'+cells+'<td class="data-editor-row-action"><button class="data-editor-delete" title="Delete row" onclick="deleteDataEditorRow('+r+')">&times;</button></td></tr>';
  }).join('');
  var statusHTML=renderDataEditorStatus(validation);
  panel.classList.remove('hidden');
  panel.innerHTML=
    '<div class="data-editor-head">'+
      '<div><div class="data-editor-title">Edit Data</div><div class="data-editor-meta">'+escapeHTML(dataEditorShapeLabel(dataEditorDraft.shape))+' &middot; '+rows.length+' rows</div></div>'+
      '<div class="data-editor-actions">'+
        '<button class="data-editor-btn primary" onclick="applyDataEditor()"'+applyDisabled+'>Apply</button>'+
        '<button class="data-editor-btn" onclick="closeDataEditor(true)">Cancel</button>'+
        '<button class="data-editor-btn" onclick="addDataEditorRow()">Add Row</button>'+
        '<button class="data-editor-btn" onclick="redetectDataEditorDraft()">Re-detect</button>'+
        '<button class="data-editor-btn" onclick="remapDataEditorDraft()">Re-map</button>'+
      '</div>'+
    '</div>'+
    '<div class="data-editor-grid-wrap"><table class="data-editor-table"><thead><tr>'+headHTML+'</tr></thead><tbody>'+bodyHTML+'</tbody></table></div>'+
    statusHTML;
}

function renderDataEditorStatus(validation){
  var bits=[];
  if(validation.errors.length){
    validation.errors.slice(0,5).forEach(function(e){bits.push('<div class="data-editor-error">'+escapeHTML(e)+'</div>');});
    if(validation.errors.length>5)bits.push('<div class="data-editor-error">+'+(validation.errors.length-5)+' more errors</div>');
  } else {
    bits.push('<div class="data-editor-ok">'+validation.validRows+' valid rows ready to apply.</div>');
  }
  validation.warnings.slice(0,4).forEach(function(w){bits.push('<div class="data-editor-warning">'+escapeHTML(w)+'</div>');});
  return '<div class="data-editor-status">'+bits.join('')+'</div>';
}

function updateDataEditorHeader(index,value){
  if(!dataEditorDraft)return;
  dataEditorDraft.headers[index]=String(value||'').trim()||('Column '+(index+1));
  renderDataEditor();
}

function updateDataEditorCell(row,col,value){
  if(!dataEditorDraft||!dataEditorDraft.rows[row])return;
  dataEditorDraft.rows[row][col]=String(value==null?'':value);
  renderDataEditor();
}

function addDataEditorRow(){
  if(!dataEditorDraft)return;
  dataEditorDraft.rows.push(dataEditorDraft.headers.map(function(){return '';}));
  renderDataEditor();
}

function deleteDataEditorRow(index){
  if(!dataEditorDraft)return;
  dataEditorDraft.rows.splice(index,1);
  renderDataEditor();
}

function isDataEditorBlankRow(row){
  return (row||[]).every(function(cell){return String(cell==null?'':cell).trim()==='';});
}

function validateEditableTable(fig,table){
  var shape=table.shape;
  var headers=table.headers||[];
  var rows=(table.rows||[]).filter(function(row){return !isDataEditorBlankRow(row);});
  var errors=[],warnings=[],validRows=0;
  if(!headers.length)errors.push('The table has no columns.');
  if(shape==='multiSeries'&&headers.length<2)errors.push('Multi-series charts need at least one series column.');
  rows.forEach(function(row,rowIdx){
    var rowLabel='Row '+(rowIdx+1);
    if(['categorySeries','partWholeSeries','multiSeries','rangeSeries','ohlcSeries'].indexOf(shape)!==-1&&!String(row[0]||'').trim()){
      errors.push(rowLabel+': label is required.');
      return;
    }
    var numericCols=getDataEditorNumericColumns(shape,headers);
    var rowOk=true;
    numericCols.forEach(function(col){
      var parsed=parseNumberCell(row[col]);
      if(!parsed.ok){
        rowOk=false;
        errors.push(rowLabel+': '+(headers[col]||('Column '+(col+1)))+' must be numeric.');
      }
      if(shape==='partWholeSeries'&&col===1&&parsed.ok&&parsed.value<=0){
        rowOk=false;
        errors.push(rowLabel+': part-to-whole values must be positive.');
      }
    });
    if(shape==='ohlcSeries'){
      var high=parseNumberCell(row[2]),low=parseNumberCell(row[3]);
      if(high.ok&&low.ok&&low.value>high.value)warnings.push(rowLabel+': low is greater than high.');
    }
    if(rowOk)validRows++;
  });
  if(validRows<2)errors.push('At least two valid rows are required.');
  return {errors:errors,warnings:warnings,validRows:validRows};
}

function getDataEditorNumericColumns(shape,headers){
  if(shape==='categorySeries'||shape==='partWholeSeries')return [1];
  if(shape==='multiSeries')return headers.map(function(h,i){return i;}).filter(function(i){return i>0;});
  if(shape==='xySeries')return [0,1];
  if(shape==='xyzSeries')return [0,1,2];
  if(shape==='rangeSeries')return [1,2];
  if(shape==='ohlcSeries')return [1,2,3,4];
  return [1];
}

function editableTableToChartPatch(fig,table){
  var validation=validateEditableTable(fig,table);
  if(validation.errors.length)return {errors:validation.errors,warnings:validation.warnings};
  var rows=(table.rows||[]).filter(function(row){return !isDataEditorBlankRow(row);});
  var headers=table.headers||[];
  var shape=table.shape;
  var patch={dataShape:shape};
  if(shape==='categorySeries'||shape==='partWholeSeries'){
    patch.labels=[];
    patch.data=[];
    rows.forEach(function(row){
      patch.labels.push(String(row[0]).trim());
      patch.data.push(parseNumberCell(row[1]).value);
    });
    patch.yLabel=headers[1]||fig.yLabel||'Value';
    patch.xLabel=fig.xLabel||patch.yLabel;
    if(shape==='partWholeSeries')patch.allowedTypes=['pie','donut','bar','column','treemap','sunburst'];
    updatePatchAxisBounds(fig,patch,patch.data);
  } else if(shape==='multiSeries'){
    patch.labels=rows.map(function(row){return String(row[0]).trim();});
    patch.datasets=headers.slice(1).map(function(header,idx){
      return {label:header||('Series '+(idx+1)),data:rows.map(function(row){return parseNumberCell(row[idx+1]).value;})};
    });
    patch.allowedTypes=['grouped-column','grouped-bar','stacked-column','stacked-column-100','stacked-bar','stacked-bar-100','split-bar','multiple-lines','stacked-area','stacked-area-100','combo','radar','multiple-pies','multiple-donuts','box-whisker','table'];
    patch.colors=patch.datasets.map(function(d,i){return {key:d.label,label:d.label,def:getColor(colorState[currentIdx]||{},[(fig.datasets&&fig.datasets[i]&&fig.datasets[i].label)||d.label],paletteColor(i))};});
    updatePatchAxisBounds(fig,patch,allDatasetValues(patch.datasets));
  } else if(shape==='xySeries'){
    patch.points=rows.map(function(row){return {x:parseNumberCell(row[0]).value,y:parseNumberCell(row[1]).value,label:String(row[2]||'').trim()};});
    patch.trend=computeTrend(patch.points);
    patch.xLabel=headers[0]||fig.xLabel||'X';
    patch.yLabel=headers[1]||fig.yLabel||'Y';
    updatePointBounds(patch,patch.points);
  } else if(shape==='xyzSeries'){
    var raw=rows.map(function(row){return {x:parseNumberCell(row[0]).value,y:parseNumberCell(row[1]).value,size:Math.abs(parseNumberCell(row[2]).value),label:String(row[3]||'').trim()};});
    patch.bubbles=scaleBubbleRows(raw);
    patch.points=patch.bubbles.map(function(p){return {x:p.x,y:p.y,label:p.label};});
    patch.trend=computeTrend(patch.points);
    patch.xLabel=headers[0]||fig.xLabel||'X';
    patch.yLabel=headers[1]||fig.yLabel||'Y';
    updatePointBounds(patch,patch.bubbles);
  } else if(shape==='rangeSeries'){
    patch.rangeData=rows.map(function(row){return {label:String(row[0]).trim(),start:parseNumberCell(row[1]).value,end:parseNumberCell(row[2]).value};});
    patch.labels=patch.rangeData.map(function(r){return r.label;});
    patch.data=patch.rangeData.map(function(r){return r.end-r.start;});
    patch.xLabel=(headers[1]||'Start')+' to '+(headers[2]||'End');
  } else if(shape==='ohlcSeries'){
    patch.ohlc=rows.map(function(row){return {label:String(row[0]).trim(),open:parseNumberCell(row[1]).value,high:parseNumberCell(row[2]).value,low:parseNumberCell(row[3]).value,close:parseNumberCell(row[4]).value};});
    patch.labels=patch.ohlc.map(function(r){return r.label;});
    patch.data=patch.ohlc.map(function(r){return r.close;});
    patch.yLabel=fig.yLabel||'Price';
    updatePatchAxisBounds(fig,patch,patch.ohlc.reduce(function(a,r){return a.concat([r.open,r.high,r.low,r.close]);},[]));
  }
  return {patch:patch,warnings:validation.warnings};
}

function scaleBubbleRows(raw){
  var sizes=raw.map(function(p){return p.size;});
  var minSize=Math.min.apply(null,sizes),maxSize=Math.max.apply(null,sizes);
  return raw.map(function(p){
    var r=maxSize===minSize?8:4+((p.size-minSize)/(maxSize-minSize))*14;
    return {x:p.x,y:p.y,r:r,size:p.size,label:p.label};
  });
}

function updatePointBounds(patch,points){
  patch.xMin=Math.min.apply(null,points.map(function(p){return p.x;}));
  patch.xMax=Math.max.apply(null,points.map(function(p){return p.x;}));
  patch.yMin=Math.min.apply(null,points.map(function(p){return p.y;}));
  patch.yMax=Math.max.apply(null,points.map(function(p){return p.y;}));
}

function updatePatchAxisBounds(fig,patch,values){
  var nums=values.filter(function(v){return typeof v==='number'&&isFinite(v);});
  if(!nums.length)return;
  var max=Math.max.apply(null,nums);
  var next=autoAxisMax(nums);
  if(fig.xMax!==undefined&&max>fig.xMax)patch.xMax=next;
  if(fig.yMax!==undefined&&max>fig.yMax)patch.yMax=next;
  if(fig.xMax===undefined&&fig.yMax===undefined)patch.yMax=next;
}

function applyDataEditor(){
  var f=FIGS[currentIdx];
  if(!f||!dataEditorDraft)return;
  var result=editableTableToChartPatch(f,dataEditorDraft);
  if(result.errors){
    renderDataEditor();
    return;
  }
  applyChartDataPatch(f,result.patch,false);
  repairBuiltInChartData(f);
  closeDataEditor(false);
  persistActiveProjectSettings();
  queueSave();
  buildColorControls();
  updateChart();
  renderSidebar();
  showImportMessage('Data updated','The chart data was updated from the editor.',false);
}

function applyChartDataPatch(target,patch,clearAxes){
  ['labels','data','points','datasets','bubbles','rangeData','ohlc','trend'].forEach(function(k){delete target[k];});
  if(clearAxes)['xMin','xMax','yMin','yMax'].forEach(function(k){delete target[k];});
  Object.keys(patch).forEach(function(k){target[k]=patch[k];});
  if(patch.colors){
    target.colors=patch.colors;
    colorState[currentIdx]=patch.colors.reduce(function(o,c){o[c.key]=c.def;return o;},{});
  }
}

function editableDraftToPreparedTable(){
  return {
    headers:(dataEditorDraft&&dataEditorDraft.headers||[]).slice(),
    rows:(dataEditorDraft&&dataEditorDraft.rows||[]).filter(function(row){return !isDataEditorBlankRow(row);}).map(function(row){return row.slice();}),
    stats:{blankRows:0,trimmedCells:0,numericConversions:0,droppedRows:0,repeatedHeaders:0}
  };
}

function redetectDataEditorDraft(){
  if(!dataEditorDraft)return;
  var table=editableDraftToPreparedTable();
  var result=detectLongTable(table,'Edited chart data',{});
  if(result.confidence==='high'&&result.fig)applyRemappedChart(result.fig,result.summary);
  else showMapperForEditor(result.table||table,result.reason||'Choose columns for the edited data.');
}

function remapDataEditorDraft(){
  if(!dataEditorDraft)return;
  showMapperForEditor(editableDraftToPreparedTable(),'Choose columns for the edited data.');
}

function showMapperForEditor(table,reason){
  showMapper(table,'Edited chart data',reason,{fromEditor:true});
  if(uploadImportDraft){
    uploadImportDraft.mode='editor-remap';
    uploadImportDraft.targetChartId=dataEditorOriginalChartId;
  }
}

function applyRemappedChart(sourceFig,summary){
  var targetId=(uploadImportDraft&&uploadImportDraft.targetChartId)||dataEditorOriginalChartId||(FIGS[currentIdx]&&FIGS[currentIdx].id);
  var idx=FIGS.findIndex(function(f){return f.id===targetId;});
  if(idx<0)return;
  currentIdx=idx;
  var target=FIGS[idx];
  var preserve={id:target.id,title:target.title,sub:target.sub,src:target.src,categoryId:target.categoryId,figureLabel:target.figureLabel,builtInId:target.builtInId,uploaded:target.uploaded,labelsDefault:target.labelsDefault};
  ['labels','data','points','datasets','bubbles','rangeData','ohlc','trend','xMin','xMax','yMin','yMax'].forEach(function(k){delete target[k];});
  Object.keys(sourceFig).forEach(function(k){
    if(typeof sourceFig[k]!=='function')target[k]=sourceFig[k];
  });
  Object.assign(target,preserve);
  colorState[idx]=(target.colors||[]).reduce(function(o,c){o[c.key]=c.def;return o;},{});
  chartTypeOverride[target.id]=target.defaultType;
  closeDataEditor(false);
  uploadImportDraft=null;
  persistActiveProjectSettings();
  queueSave();
  showChart(idx);
  showImportSummary(target,summary||{chartType:target.defaultType,columns:'edited data',warnings:[],stats:{}},{});
}

function buildColorControls(){
  var container=document.getElementById('colorControls');
  container.innerHTML='';
  var f=FIGS[currentIdx];
  if(!f)return;
  var type=getSelectedChartType(currentIdx);
  var defs=ensureColorDefaults(currentIdx,type);
  defs.forEach(function(c){
    var wrap=document.createElement('span');
    wrap.style.display='inline-flex';
    wrap.style.alignItems='center';
    wrap.style.gap='4px';
    wrap.style.marginRight='8px';
    var lbl=document.createElement('span');
    lbl.textContent=c.label+':';
    lbl.style.fontSize='12px';
    lbl.style.color='#5a5e6b';
    lbl.style.fontWeight='500';
    var picker=document.createElement('input');
    picker.type='color';
    picker.value=colorState[currentIdx][c.key];
    picker.dataset.key=c.key;
    picker.addEventListener('input',function(e){
      colorState[currentIdx][c.key]=e.target.value;
      queueSave();
      updateChart();
    });
    wrap.appendChild(lbl);
    wrap.appendChild(picker);
    container.appendChild(wrap);
  });
}

function resetColors(){
  var f=FIGS[currentIdx];
  if(!f)return;
  var type=getSelectedChartType(currentIdx);
  var next=Object.assign({},colorState[currentIdx]||{});
  getColorControlDefs(f,type).forEach(function(c){next[c.key]=c.def;});
  colorState[currentIdx]=next;
  buildColorControls();
  queueSave();
  updateChart();
}

function buildLegend(f,type){
  var el=document.getElementById('cLegend');
  var legendFmt=getChartFormat(currentIdx).legend;
  var stage=document.getElementById('chartStage');
  el.className='legend-row';
  el.innerHTML='';
  if(stage){
    stage.className='chart-stage';
    if(legendFmt.position==='right')stage.classList.add('legend-right-stage');
    if(el.parentNode!==stage)stage.insertBefore(el,stage.firstChild);
  }
  if(legendFmt.show===false){
    el.classList.add('legend-hidden');
    return;
  }
  if(legendFmt.position==='bottom')el.classList.add('legend-bottom');
  if(legendFmt.position==='right')el.classList.add('legend-right');
  type=getRenderableChartType(type);
  if(['bar','column','dot','range','arrow','histogram','waterfall','bullet-bar','table','surface'].indexOf(type)!==-1)return;
  if(type==='line'){
    var cs=colorState[currentIdx];
    var s=document.createElement('span');
    s.className='legend-item';
    s.innerHTML='<span style="width:20px;height:2px;background:'+getColor(cs,['line','bar','trend'],'#8B2635')+';display:inline-block"></span>Data';
    el.appendChild(s);
    return;
  }
  if(type==='area'){
    var ac=colorState[currentIdx];
    var fill=document.createElement('span');
    fill.className='legend-item';
    fill.innerHTML='<span class="legend-swatch" style="background:'+getColor(ac,['area','line','bar'],'#D99AA5')+'"></span>Area';
    el.appendChild(fill);
    var line=document.createElement('span');
    line.className='legend-item';
    line.innerHTML='<span style="width:20px;height:2px;background:'+getColor(ac,['line','bar'],'#8B2635')+';display:inline-block"></span>Line';
    el.appendChild(line);
    return;
  }
  if(['grouped-column','grouped-bar','stacked-column','stacked-column-100','stacked-bar','stacked-bar-100','split-bar','multiple-lines','stacked-area','stacked-area-100','combo','radar','multiple-pies','multiple-donuts','box-whisker','stock'].indexOf(type)!==-1){
    var series=type==='stock'
      ?{datasets:[{label:'High-Low'},{label:'Close'}]}
      :getMultiSeries(f);
    series.datasets.forEach(function(d,i){
      var s=document.createElement('span');
      s.className='legend-item';
      s.innerHTML='<span class="legend-swatch" style="background:'+getColor(colorState[currentIdx],[d.label,type==='stock'&&d.label==='Close'?'line':'range'],paletteColor(i))+'"></span>'+d.label;
      el.appendChild(s);
    });
    return;
  }
  if(type==='scatter'){
    var sc=colorState[currentIdx];
    var s1=document.createElement('span');
    s1.className='legend-item';
    s1.innerHTML='<span class="legend-swatch" style="background:'+getColor(sc,['dots','point','bar'],'#8B2635')+';border-radius:50%"></span>Data point';
    el.appendChild(s1);
    if(f.trend){
      var s2=document.createElement('span');
      s2.className='legend-item';
      s2.innerHTML='<span style="width:20px;height:2px;background:'+getColor(sc,['trend','line'],'#1B2A4A')+';display:inline-block"></span>Regresi linier';
      el.appendChild(s2);
    }
    return;
  }
  if(type==='bubble'){
    var bc=colorState[currentIdx];
    var b=document.createElement('span');
    b.className='legend-item';
    b.innerHTML='<span class="legend-swatch" style="background:'+getColor(bc,['bubbleFill','bubble','dots','bar'],'#8B2635')+';border:1px solid '+getColor(bc,['bubbleBorder','bubble','dots','bar'],'#8B2635')+';border-radius:50%"></span>Bubble';
    el.appendChild(b);
    return;
  }
  if(type==='choropleth-map'||type==='excel-map'){
    var gc=colorState[currentIdx];
    var low=document.createElement('span');
    low.className='legend-item';
    low.innerHTML='<span class="legend-swatch" style="background:'+getColor(gc,['low','bar'],'#dbeafe')+'"></span>Low';
    el.appendChild(low);
    var high=document.createElement('span');
    high.className='legend-item';
    high.innerHTML='<span class="legend-swatch" style="background:'+getColor(gc,['high','bar'],'#8B2635')+'"></span>High';
    el.appendChild(high);
    return;
  }
  if(['pie','donut','election-donut','treemap','sunburst','funnel'].indexOf(type)!==-1){
    var part=getPartWholeSeries(f);
    part.labels.forEach(function(label,i){
      var s=document.createElement('span');
      s.className='legend-item';
      s.innerHTML='<span class="legend-swatch" style="background:'+getColor(colorState[currentIdx],['slice_'+i],paletteColor(i))+'"></span>'+escapeHTML(label);
      el.appendChild(s);
    });
    return;
  }
  if(type==='symbol-map'||type==='locator-map'){
    var mc=colorState[currentIdx];
    var m=document.createElement('span');
    m.className='legend-item';
    m.innerHTML='<span class="legend-swatch" style="background:'+getColor(mc,['bar','bubbleFill','dots'],'#8B2635')+';border-radius:50%"></span>Location value';
    el.appendChild(m);
  }
}

function getLabelOptions(){
  return {
    show:document.getElementById('showLabels').checked,
    style:document.getElementById('labelStyle').value
  };
}

function boxedStyle(lbl,baseColor){
  if(lbl.style==='boxed'){
    return {
      color:baseColor||'#1B2A4A',
      backgroundColor:'#ffffff',
      borderColor:'#d1d5db',
      borderWidth:1,

      padding:{top:3,bottom:3,left:6,right:6}
    };
  }
  return {
    color:baseColor||'#1B2A4A',

function renderEditableField(elId,field,fallback,placeholder){
  var el=document.getElementById(elId);
  if(!el)return;
  var f=FIGS[currentIdx];
  el.innerHTML='';
  if(!f){
    el.textContent=fallback||'';
    return;
  }
  var wrap=document.createElement('span');
  wrap.className='editable-line';
  var text=document.createElement('span');
  text.className='editable-text';
  var value=f[field]||fallback||'';
  text.textContent=value;
  var btn=document.createElement('button');
  btn.className='edit-pencil';
  btn.type='button';
  btn.title='Edit '+(placeholder||field);
  btn.setAttribute('aria-label','Edit '+(placeholder||field));
  btn.textContent='✎';
  btn.onclick=function(){startInlineEdit(elId,field,placeholder||field);};
  wrap.appendChild(text);
  wrap.appendChild(btn);
  el.appendChild(wrap);
}

function startInlineEdit(elId,field,label){
  var el=document.getElementById(elId);
  var f=FIGS[currentIdx];
  if(!el||!f)return;
  var current=f[field]||'';
  el.innerHTML='';
  var input=document.createElement('input');
  input.className='inline-edit-input';
  input.value=current;
  input.placeholder=label||field;
  function commit(){
    var next=input.value.trim();
    if(next!==current){
      f[field]=next;
      persistActiveProjectSettings();
      renderSidebar();
      queueSave();
    }
    refreshChartText();
  }
  function cancel(){
    refreshChartText();
  }
  input.onkeydown=function(e){
    if(e.key==='Enter')commit();
    if(e.key==='Escape')cancel();
  };
  input.onblur=commit;
  el.appendChild(input);
  input.focus();
  input.select();
}

function refreshChartText(){
  var f=FIGS[currentIdx];
  if(!f)return;
  renderEditableField('cTitle','title','Untitled chart','title');
  renderEditableField('cSubtitle','sub','', 'subtitle');
  renderEditableField('cSource','src','', 'source');
}

function showChart(idx){
  if(idx<0||!FIGS[idx]){
    if(dataEditorOpen)closeDataEditor(true);
    currentIdx=-1;
    if(chart){chart.destroy();chart=null;}
    document.getElementById('cTitle').textContent='No chart selected';
    document.getElementById('cSubtitle').textContent='Click + Add Chart to import data into this project.';
    document.getElementById('cSource').textContent='';
    document.getElementById('cLegend').innerHTML='';
    buildColorControls();
    syncChartTypeControls();
    syncLineThicknessControls();
    syncFormatPanel();
    renderSidebar();
    return;
  }
  if(dataEditorOpen&&dataEditorOriginalChartId&&FIGS[idx].id!==dataEditorOriginalChartId)closeDataEditor(true);
  currentIdx=idx;
  var f=FIGS[idx];
  if(repairBuiltInChartData(f)){
    persistActiveProjectSettings();
    queueSave();
  }
  renderSidebar();
  refreshChartText();
  document.getElementById('showLabels').checked=getLabelsShown(idx);
  syncChartTypeControls();
  syncLineThicknessControls();
  syncDotsControl();
  buildColorControls();
  syncFormatPanel();
  updateChart();
  applyDimensions();
  syncSizeInputs();
}

function updateChart(){
  if(chart){chart.destroy();chart=null;}
  var f=FIGS[currentIdx];
  if(!f){
    var legend=document.getElementById('cLegend');
    if(legend)legend.innerHTML='';
    return;
  }
  if(repairBuiltInChartData(f)){
    persistActiveProjectSettings();
    queueSave();
  }
  var ctx=document.getElementById('mainCanvas');
  var lbl=getLabelOptions();
  var selectedType=getSelectedChartType(currentIdx);
  var renderableType=getRenderableChartType(selectedType);
  ensureColorDefaults(currentIdx,selectedType);
  var cs=colorState[currentIdx];
  syncLineThicknessControls();
  buildLegend(f,renderableType);
  var def=getChartTypeDef(renderableType);
  var renderer=def&&CHART_RENDERERS[def.renderer];
  if(renderer)renderer(ctx,f,cs,lbl,selectedType);
  else renderHBarSimple(ctx,f,cs,lbl,selectedType);
}

var CHART_RENDERERS={
  bar:renderHBarSimple,
  column:renderVBarSimple,
  line:renderLineSimple,
  scatter:renderScatter,
  'split-bar':renderSplitBar,
  'grouped-column':function(ctx,f,cs,lbl){renderMultiBarColumn(ctx,f,cs,lbl,{horizontal:false,stacked:false,percent:false});},
  'grouped-bar':function(ctx,f,cs,lbl){renderMultiBarColumn(ctx,f,cs,lbl,{horizontal:true,stacked:false,percent:false});},
  'stacked-column':function(ctx,f,cs,lbl){renderMultiBarColumn(ctx,f,cs,lbl,{horizontal:false,stacked:true,percent:false});},
  'stacked-column-100':function(ctx,f,cs,lbl){renderMultiBarColumn(ctx,f,cs,lbl,{horizontal:false,stacked:true,percent:true});},
  'stacked-bar':function(ctx,f,cs,lbl){renderMultiBarColumn(ctx,f,cs,lbl,{horizontal:true,stacked:true,percent:false});},
  'stacked-bar-100':function(ctx,f,cs,lbl){renderMultiBarColumn(ctx,f,cs,lbl,{horizontal:true,stacked:true,percent:true});},
  'bullet-bar':renderBulletBar,
  dot:renderDotPlot,
  range:function(ctx,f,cs,lbl){renderRangePlot(ctx,f,cs,lbl,false);},
  arrow:function(ctx,f,cs,lbl){renderRangePlot(ctx,f,cs,lbl,true);},
  'multiple-lines':function(ctx,f,cs,lbl){renderMultiLine(ctx,f,cs,lbl,false);},
  area:renderAreaChart,
