name: research-nightly

on:
  schedule:
    # 22:30 UTC = 05:30 WIB; chain finishes with the 06:30 WIB brief push
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: research-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: US market close ingest
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python pipeline/jobs.py ingest_us
      - name: Compute, reason, brief, audit
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUSH_CHAT_ID: ${{ secrets.TELEGRAM_PUSH_CHAT_ID }}
        run: python pipeline/jobs.py nightly
