name: research-weekly

on:
  schedule:
    # Sunday 10:00 UTC = 17:00 WIB — IC packet lands Sunday evening
    - cron: "0 10 * * 0"
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: COT + adversary + IC packet
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUSH_CHAT_ID: ${{ secrets.TELEGRAM_PUSH_CHAT_ID }}
        run: python pipeline/jobs.py weekly
