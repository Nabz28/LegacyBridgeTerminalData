name: research-deep

# LEGION's deep-research worker. Dispatched immediately by the deep_research
# tool (api/_research/core.js) via the GitHub API; the cron is the sweep that
# catches anything the dispatch missed.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 */2 * * *"

concurrency:
  group: research-deep
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Drain deep-research queue
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUSH_CHAT_ID: ${{ secrets.TELEGRAM_PUSH_CHAT_ID }}
        run: python pipeline/jobs.py deep
