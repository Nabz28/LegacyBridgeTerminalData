name: research-alerts

on:
  schedule:
    # hourly during global market hours (00-10 UTC Asia/EU, 13-21 UTC US)
    - cron: "15 0-10,13-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: research-alerts
  cancel-in-progress: true

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Level alerts
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUSH_CHAT_ID: ${{ secrets.TELEGRAM_PUSH_CHAT_ID }}
        run: python pipeline/jobs.py alerts
      - name: News sweep
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python pipeline/jobs.py news
